<style>
/* Layout: navy command bar + white tab strip over a cool workspace; dense two-column work surfaces, each with an AI rail */
:root {
  --bg: #f6f8fa; --surface: #ffffff; --surface-2: #f3f5f8; --surface-3: #e9edf2;
  --border: #e1e5ea; --border-strong: #c8ced7;
  --fg: #131b2e; --fg-2: #34405a; --muted: #5b6784;
  --nav: #0c1b33; --nav-2: #1c2c4b; --nav-fg: #ffffff; --nav-muted: #a6b5d4;
  --accent: #c8281b; --accent-hover: #a91f14; --accent-soft: #fde5e1; --accent-fg: #ffffff; --accent-text: #b51d13;
  --ok: #0b6b30; --ok-soft: #dbf4e2; --ok-strong: #1f9d4c;
  --warn: #8a5200; --warn-soft: #fff0d0; --warn-strong: #d98a00;
  --bad: #a3120b; --bad-soft: #ffe2dd; --bad-strong: #d93829;
  --info: #24448a; --info-soft: #e4ebfd;

  --shadow-lg: 0 12px 40px rgba(12, 27, 51, .22);
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --r-sm: 3px; --r: 5px; --r-lg: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-px-theme]) {
    --bg: #0a101e; --surface: #111a2b; --surface-2: #162036; --surface-3: #1f2a43;
    --border: #253049; --border-strong: #35425f;
    --fg: #e8ecf7; --fg-2: #c5cde2; --muted: #8f9bb8;
    --nav: #050a15; --nav-2: #17233c; --nav-fg: #f2f5fb; --nav-muted: #8d9dbf;
    --accent: #df402e; --accent-hover: #ef5745; --accent-soft: #3b1613; --accent-fg: #ffffff; --accent-text: #ff8b7a;
    --ok: #74de94; --ok-soft: #0f2f1b; --ok-strong: #3fc56d;
    --warn: #f4bd5f; --warn-soft: #31230b; --warn-strong: #e9a33a;
    --bad: #ff9283; --bad-soft: #3a1512; --bad-strong: #f0604c;
    --info: #a3baff; --info-soft: #17254a;
    --l1: #113220; --l1-edge: #2a6b41;
    --bar-ink: #7d8db0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-px-theme="dark"] {
  --bg: #0a101e; --surface: #111a2b; --surface-2: #162036; --surface-3: #1f2a43;
  --border: #253049; --border-strong: #35425f;
  --fg: #e8ecf7; --fg-2: #c5cde2; --muted: #8f9bb8;
  --nav: #050a15; --nav-2: #17233c; --nav-fg: #f2f5fb; --nav-muted: #8d9dbf;
  --accent: #df402e; --accent-hover: #ef5745; --accent-soft: #3b1613; --accent-fg: #ffffff; --accent-text: #ff8b7a;
  --ok: #74de94; --ok-soft: #0f2f1b; --ok-strong: #3fc56d;
  --warn: #f4bd5f; --warn-soft: #31230b; --warn-strong: #e9a33a;
  --bad: #ff9283; --bad-soft: #3a1512; --bad-strong: #f0604c;
  --info: #a3baff; --info-soft: #17254a;
  --l1: #113220; --l1-edge: #2a6b41;
  --bar-ink: #7d8db0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; color: var(--fg); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.caps { font-size: 11px; line-height: 16px; letter-spacing: .06em; font-weight: 600; text-transform: uppercase; color: var(--muted); }
.ms { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 18px; line-height: 1; width: 1em; height: 1em; overflow: hidden; display: inline-block; flex: none; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga'; vertical-align: -0.2em; }
.ms.fill { font-variation-settings: 'FILL' 1; }
.ms.sm { font-size: 16px; }
.ms.lg { font-size: 20px; }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* App bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; box-shadow: 0 1px 8px rgba(0, 0, 0, .06); }
.bar-top { background: var(--nav); color: var(--nav-fg); }
.bar-top-in { min-height: 56px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; flex: none; font-weight: 700; letter-spacing: -.01em; font-size: 16px; color: var(--nav-fg); }
.brand svg { width: 28px; height: 28px; flex: none; }
.brand b { color: var(--bad-strong); font-weight: 700; }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; color: var(--nav-fg); }
.crumb .sep { color: var(--nav-muted); }
.crumb .tag { font-size: 10.5px; letter-spacing: .07em; font-weight: 600; text-transform: uppercase; background: var(--nav-2); color: var(--nav-muted); padding: 2px 6px; border-radius: var(--r-sm); flex: none; }
.crumb .ev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.search { position: relative; flex: 0 1 280px; min-width: 0; }
.search .ms { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--nav-muted); }
.search input { width: 100%; background: var(--nav-2); border: 1px solid transparent; color: var(--nav-fg); border-radius: var(--r); padding: 7px 10px 7px 32px; font-size: 13px; }
.search input::placeholder { color: var(--nav-muted); }
.search input:focus { outline: none; border-color: var(--nav-muted); }
.iconbtn { position: relative; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r); border: 0; background: transparent; color: var(--nav-muted); }
.iconbtn:hover { background: var(--nav-2); color: var(--nav-fg); }
.iconbtn .dot { position: absolute; top: 4px; right: 3px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--bad-strong); color: #fff; font-size: 10px; font-weight: 700; line-height: 15px; }
.who { display: flex; align-items: center; gap: 10px; flex: none; padding-left: 12px; border-left: 1px solid var(--nav-2); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--nav-2); color: var(--nav-fg); box-shadow: inset 0 0 0 1px var(--nav-muted); }
.who .nm { display: grid; line-height: 1.15; }
.who .nm span { font-size: 13px; font-weight: 600; }
.who .nm small { font-size: 10.5px; color: var(--nav-muted); letter-spacing: .05em; text-transform: uppercase; font-weight: 600; }
.bar-tabs { background: var(--surface); border-bottom: 1px solid var(--border); }
.bar-tabs-in { display: flex; align-items: stretch; justify-content: space-between; gap: 16px; min-height: 46px; }
.tabs { display: flex; gap: 28px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14px; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent-text); border-bottom-color: var(--accent); font-weight: 600; }
.tab .badge { font-size: 10.5px; font-weight: 700; background: var(--bad-soft); color: var(--bad); border-radius: 9px; padding: 0 6px; }
.bar-meta { display: flex; align-items: center; gap: 12px; flex: none; font-size: 12.5px; color: var(--muted); }
.bar-meta strong { color: var(--fg); }
.stage { font-size: 11px; letter-spacing: .06em; font-weight: 600; text-transform: uppercase; padding: 3px 8px; border-radius: var(--r-sm); background: var(--surface-3); color: var(--fg); }

/* Page heads */
.pagehead { background: var(--surface-2); border-bottom: 1px solid var(--border); }
.pagehead-in { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; padding-block: 12px; }
.ph-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.ph-title h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.ph-title .ico { width: 30px; height: 30px; border-radius: var(--r); display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); flex: none; }
.ph-sub { font-size: 12px; color: var(--muted); }
.ph-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok-strong); }
.content { padding-block: 20px 32px; display: grid; gap: 20px; }

/* Cards, chips, buttons */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.card-h h2, .card-h h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card-h h2 .ms, .card-h h3 .ms { color: var(--muted); }
.card-b { padding: 16px; }
.card-f { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--r-lg) var(--r-lg); font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; line-height: 16px; letter-spacing: .05em; font-weight: 700; text-transform: uppercase; padding: 1px 6px; border-radius: var(--r-sm); white-space: nowrap; background: var(--surface-3); color: var(--fg-2); }
.chip .ms { font-size: 13px; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.dark { background: var(--nav); color: var(--nav-fg); }
.chip.accent { background: var(--accent); color: var(--accent-fg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); padding: 7px 12px; border-radius: var(--r); font-size: 13px; font-weight: 500; white-space: nowrap; line-height: 18px; }
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn.soft { background: var(--surface-3); border-color: transparent; }
.btn.soft:hover { background: var(--border); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.dark { background: var(--nav); border-color: var(--nav); color: var(--nav-fg); font-weight: 600; }
.btn.dark:hover { background: var(--nav-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--surface-3); }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn.lg { padding: 10px 18px; font-size: 14.5px; }
.btn.block { width: 100%; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent-text); font-weight: 500; font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }
.linkbtn:hover { text-decoration: underline; }
.x { border: 0; background: none; color: var(--muted); padding: 2px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
.x:hover { color: var(--bad); background: var(--bad-soft); }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--fg-2); }
.input, .select, .textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 7px 10px; font-size: 13.5px; color: var(--fg); min-width: 0; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--info); box-shadow: 0 0 0 3px var(--info-soft); background: var(--surface); }
.textarea { resize: vertical; line-height: 1.55; }
.input.bare { background: transparent; border-color: transparent; padding: 3px 6px; }
.input.bare:hover { border-color: var(--border); }
.input.bare:focus { background: var(--surface); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--border-strong); position: relative; margin: 0; cursor: pointer; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked { background: var(--nav); }
:root[data-px-theme="dark"] .switch input:checked { background: var(--info); }
.switch input:checked::after { transform: translateX(14px); }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r); font-size: 12.5px; background: var(--info-soft); color: var(--info); }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.bad { background: var(--bad-soft); color: var(--bad); }
.note.ok { background: var(--ok-soft); color: var(--ok); }

/* Tables */
.tblwrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--muted); background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .r { text-align: right; }
.tbl .c { text-align: center; }
.item-name { font-weight: 600; color: var(--fg); }
.item-spec { font-size: 12px; color: var(--muted); margin-top: 2px; max-width: 46ch; }
.flash { animation: flash 2.2s ease-out; }
@keyframes flash { 0%, 30% { background: var(--warn-soft); } 100% { background: transparent; } }

/* Grids */
.g-rfx { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
.g-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); gap: 20px; align-items: start; }
.stack { display: grid; gap: 20px; min-width: 0; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; align-content: space-between; min-height: 92px; }
.kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.kpi .v small { font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.kpi .v.accent { color: var(--accent-text); }

/* Chat */
.chat { display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 520px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 118px); overflow: hidden; }
.chat-h { background: var(--nav); color: var(--nav-fg); padding: 12px 14px; display: flex; align-items: center; gap: 10px; border-radius: var(--r-lg) var(--r-lg) 0 0; }
.chat-h .ico { width: 32px; height: 32px; border-radius: var(--r); background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.chat-h b { display: block; font-size: 14.5px; }
.chat-h small { color: var(--nav-muted); font-size: 11.5px; }
.chat-sub { display: flex; justify-content: space-between; gap: 8px; padding: 6px 14px; border-bottom: 1px solid var(--border); background: var(--surface-2); font-size: 11px; }
.chat-log { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 14px; align-content: start; }
.msg { display: grid; gap: 4px; max-width: 92%; min-width: 0; }
.msg .who-l { font-size: 11.5px; font-weight: 600; color: var(--fg-2); display: flex; gap: 6px; align-items: baseline; }
.msg .who-l time { color: var(--muted); font-weight: 400; }
.msg .bub { padding: 10px 12px; border-radius: var(--r-lg); font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }
.msg.user { justify-self: end; }
.msg.user .who-l { justify-content: flex-end; }
.msg.user .bub { background: var(--info-soft); color: var(--fg); }
.msg.ai .who-l { color: var(--accent-text); }
.msg.ai .bub { background: var(--surface); border: 1px solid var(--border); }
.msg.err .bub { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.bub p + p, .bub p + ul, .bub ul + p, .bub p + ol, .bub ol + p { margin-top: 8px; }
.bub ul, .bub ol { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.bub .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.thinking { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: .15s; }
.thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes pulse { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.chat-in { border-top: 1px solid var(--border); padding: 10px 12px 12px; display: grid; gap: 8px; background: var(--surface); border-radius: 0 0 var(--r-lg) var(--r-lg); }
.chat-in textarea { min-height: 64px; max-height: 160px; }
.chat-in-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sugs { display: flex; flex-wrap: wrap; gap: 6px; }
.sug { border: 1px solid var(--border); background: var(--surface-2); border-radius: var(--r); padding: 4px 9px; font-size: 12px; color: var(--fg-2); text-align: left; }
.sug:hover { border-color: var(--info); color: var(--info); }
.sug:disabled { opacity: .5; cursor: not-allowed; border-color: var(--border); color: var(--fg-2); }
.ai-off { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; }

/* RFx sections */
.spec-head { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.spec-head .t { display: grid; gap: 6px; min-width: 0; flex: 1 1 360px; }
.spec-head input.title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sec-h h3 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sec-h h3 .ms { color: var(--accent-text); }

/* Minimal, safe Markdown for AI answers: paragraphs, bullets, numbers, bold. */
function md(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const out = []; let list = null;
  for (const raw of String(text).split('\n')) {
    const line = raw.trimEnd();
    const b = line.match(/^\s*[-*•]\s+(.*)$/), n = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (b || n) {
      const type = b ? 'ul' : 'ol';
      if (!list || list.type !== type) { if (list) out.push(`</${list.type}>`); list = { type }; out.push(`<${type}>`); }
      out.push(`<li>${inline((b || n)[1])}</li>`);
      continue;
    }
    if (list) { out.push(`</${list.type}>`); list = null; }
    if (!line.trim()) continue;
    const h = line.match(/^#{1,6}\s+(.*)$/);
    out.push(`<p>${h ? `<strong>${inline(h[1])}</strong>` : inline(line)}</p>`);
  }
  if (list) out.push(`</${list.type}>`);
  return out.join('');
}

function evaluate() {
  const allLines = issuedLines();

  const qualifiedIds = invitedVendors().filter(v => v.iso === true && quotedBy(v.id)).map(v => v.id);
  const awaiting = allLines.filter(l => !qualifiedIds.some(id => (S.quotes[id] || {})[l.id]?.rate != null));
  const lines = allLines.filter(l => !awaiting.includes(l));
  const rows = invitedVendors().map(v => {
    const q = S.quotes[v.id] || {};
    let total = 0, count = 0;
    for (const l of lines) { const c = q[l.id]; if (c && c.rate != null) { total += c.rate * l.qty; count++; } }
    const pending = count === 0;
    return { v, total, count, pending, complete: lines.length > 0 && count === lines.length, qualified: v.iso === true && !pending };
  });
  const eligible = rows.filter(r => r.qualified && r.complete).sort((a, b) => a.total - b.total);
  const best = eligible[0] || null;
  const l1 = {};
  // Per-line ranks among qualified vendors' reviewed rates: L1 = lowest, L2 = next, ties share a rank.
  const ranks = {};
  for (const l of lines) {
    const valid = rows.filter(r => r.qualified).map(r => ({ id: r.v.id, c: (S.quotes[r.v.id] || {})[l.id] })).filter(x => usable(x.c)).sort((a, b) => a.c.rate - b.c.rate);
    const m = ranks[l.id] = {}; let rank = 0, prev = null;
    valid.forEach((x, i) => { if (x.c.rate !== prev) { rank = i + 1; prev = x.c.rate; } m[x.id] = rank; });
  }
  const alloc = lines.map(l => {
    let bestV = null, bestRate = Infinity;
    for (const r of rows) {
      if (!r.qualified) continue;
      const c = (S.quotes[r.v.id] || {})[l.id];
      if (usable(c) && c.rate < bestRate) { bestRate = c.rate; bestV = r.v; }
    }
    if (bestV) l1[l.id] = bestV.id;
    return { line: l, vendor: bestV, rate: bestV ? bestRate : null, amount: bestV ? bestRate * l.qty : 0 };
  });
  const splitTotal = alloc.reduce((s, a) => s + a.amount, 0);
  const unallocated = alloc.filter(a => !a.vendor);
  const splitVendors = [...new Set(alloc.filter(a => a.vendor).map(a => a.vendor.id))];
  const minTotal = best ? best.total : null;
  const scored = rows.map(r => {
    const wc = wcScore(r.v.paymentDays);
    const score = r.pending ? null : Math.round(((minTotal && r.total ? Math.min(1, minTotal / r.total) : 0) * 60 * (r.complete ? 1 : r.count / lines.length) + (r.v.iso ? 20 : 0) + wc / 100 * 20) * 10) / 10;
    return { ...r, wc, score };

}

/* The L1 column: who holds the lowest valid rate on this line, its line value, and the gap to L2. */
function l1Cell(ev, l) {
  const vid = ev.l1[l.id];
  if (!vid) return ev.awaiting.includes(l) ? '<td class="l1c muted">Awaiting quotes<br>Added by amendment</td>' : '<td class="l1c muted">No valid rate yet</td>';
  const rate = S.quotes[vid][l.id].rate;
  const r = ev.ranks[l.id] || {};
  const l2 = Object.keys(r).filter(id => r[id] > 1).map(id => S.quotes[id][l.id].rate).sort((a, b) => a - b)[0];
  const tied = Object.keys(r).filter(id => r[id] === 1).length > 1;
  return `<td class="l1c"><span class="l1b" style="margin:0 4px 0 0">L1</span><b>${esc(vendorById(vid).name.split(' ')[0])}${tied ? ' (tie)' : ''}</b>
    <div class="tnum">${rateFmt(rate)} <span class="muted">· ${inr(rate * l.qty)}</span></div>
    ${l2 != null ? `<div class="muted tnum" style="font-size:11.5px">${rateFmt(l2 - rate)} below L2</div>` : '<div class="muted" style="font-size:11.5px">Only valid rate</div>'}</td>`;
}

  const vendorMatch = f ? rows.filter(r => r.v.name.toLowerCase().includes(f)) : [];
  const cols = vendorMatch.length ? vendorMatch : rows;
  const shownLines = vendorMatch.length || !f ? lines : lines.filter(l => (l.name + ' ' + l.spec + ' ' + l.site).toLowerCase().includes(f));
  const openFlags = S.flags.filter(x => x.status === 'open' && lineById(x.line) && S.invited.includes(x.vendor));
  const sel = S.flags.find(x => x.id === S.ui.selFlag && lineById(x.line)) || openFlags[0] || null;

  const intake = ev.rows.map(r => {
    const st = vendorStatus(r.v);

    return `<div class="icard ${bad ? 'bad' : ''}">
      <div class="top"><b title="${esc(r.v.name)}">${esc(r.v.name)}</b>${st.key === 'pending' ? `<span class="chip">${icon('hourglass_top')}Pending</span>` : `<span class="chip ok">${icon('check')}Received</span>`}</div>

    </div>`;
  }).join('');

  const head = cols.map(r => `<th class="vh">${esc(r.v.name.split(' ')[0])}<br>${r.pending ? '<span class="chip">Pending</span>' : r.qualified ? `<span class="chip ok">${icon('verified')}Qualified</span>` : `<span class="chip bad">${icon('block')}${r.v.iso === false ? 'No ISO' : 'Unverified'}</span>`}</th>`).join('');
  const body = shownLines.map((l, i) => `<tr>
    <td class="muted tnum">${String(lines.indexOf(l) + 1).padStart(2, '0')}</td>
    <td><div class="item-name">${esc(l.name)}${ev.awaiting.includes(l) ? ' <span class="chip warn">Awaiting quotes</span>' : ''}${S.flags.some(x => x.line === l.id && x.status === 'open' && S.invited.includes(x.vendor)) ? ' <span class="chip bad">Audit</span>' : ''}</div><div class="item-spec">${esc(l.spec)}</div></td>
    <td class="r tnum muted">${l.qty.toLocaleString('en-IN')} <small>${esc(l.uom)}</small></td>
    ${l1Cell(ev, l)}
    ${cols.map(r => {
      const c = (S.quotes[r.v.id] || {})[l.id];
      if (!c || c.rate == null) return `<td class="cell muted">—</td>`;
      const flag = S.flags.find(x => x.vendor === r.v.id && x.line === l.id && lineById(x.line));
      const rank = (ev.ranks[l.id] || {})[r.v.id];
      const isL1 = rank === 1;
      const fxb = c.orig ? `<span class="fxb" title="Quoted ${esc((CUR_SYM[c.orig.cur] || c.orig.cur + ' ') + c.orig.rate)} × ₹${c.orig.fx} per ${esc(c.orig.cur)}">${esc(c.orig.cur)}</span>` : '';
      const cls = ['cell', isL1 ? 'l1' : '', flag ? 'clickable' : '', flag && flag.status === 'open' && flag.severity === 'low' ? 'flag-low' : '', sel && flag && sel.id === flag.id ? 'sel' : ''].join(' ');
      return `<td class="${cls}" ${flag ? `data-action="select-flag" data-id="${flag.id}" tabindex="0" title="Open extraction audit"` : ''}>${flag && flag.status === 'open' ? icon('warning', 'sm') + ' ' : ''}<span class="rate tnum">${rateFmt(c.rate)}</span>${rank ? `<span class="${isL1 ? 'l1b' : 'lr'}">L${rank}</span>` : ''}${fxb}<span class="cf ${c.conf}">${CONF_LABEL[c.conf] || c.conf}</span></td>`;
    }).join('')}
  </tr>`).join('');

  const v = sel ? vendorById(sel.vendor) : null, sl = sel ? lineById(sel.line) : null;
  const cur = sel ? (S.quotes[sel.vendor] || {})[sel.line] : null;
  const rawHtml = sel ? esc(sel.raw).split('\n').map(x => x.startsWith('&gt;&gt;') ? `<span class="hl">${x.slice(8)}</span>` : x).join('\n') : '';
  const audit = sel ? `<div class="card">
      <div class="audit-h"><div><small>${icon('troubleshoot', 'sm')} Extraction audit</small><b>${esc(v.name)} · Line ${esc(sel.line.slice(1))}</b></div><span class="chip ${sel.status === 'open' ? 'bad' : sel.status === 'approved' ? 'ok' : 'info'}">${sel.status === 'open' ? `Flag ${esc(sel.id)}` : sel.status === 'approved' ? 'Resolved' : 'Clarification sent'}</span></div>
      <div class="card-b stack" style="gap:14px">
        <div class="kv"><span>Target item</span><span>${esc(sl.name)}</span></div>
        <div><div class="sec-h" style="margin-bottom:6px"><span class="caps">Source inspection</span><span class="muted" style="font-size:12px">${icon('attach_file', 'sm')} ${esc(sel.file)}</span></div><div class="scan">${rawHtml}</div></div>
        <div class="kv"><span>Normalised extraction</span><span class="tnum" style="color:var(--accent-text)">${rateFmt(cur?.rate ?? 0)} / ${esc(sl.uom === 'Units' ? 'pc' : sl.uom.toLowerCase())}</span></div>
        <div class="kv"><span>OCR confidence</span><span class="tnum">${sel.confidence}% <span class="muted" style="font-weight:400">(threshold 85%)</span></span></div>
        <div class="note ${sel.severity === 'low' ? 'bad' : 'warn'}">${icon('error', 'sm')}<span><b>${sel.severity === 'low' ? 'Low' : 'Medium'} confidence.</b> ${esc(sel.reason)}</span></div>
        ${sel.status === 'open' ? `<div class="field"><span>Corrected rate (₹ per ${esc(sl.uom === 'Units' ? 'unit' : sl.uom.toLowerCase())})</span><div style="display:flex;gap:8px"><input class="input tnum" id="flag-rate" inputmode="decimal" value="${cur?.rate ?? ''}"><button class="btn" type="button" data-action="flag-approve" data-id="${sel.id}">${icon('done_all', 'sm')} Approve value</button></div></div>
        <button class="btn dark block" type="button" data-action="flag-clarify" data-id="${sel.id}">${icon('forward_to_inbox', 'sm')} Request vendor clarification</button>` : `<p class="muted" style="font-size:12.5px">${sel.status === 'approved' ? 'Value approved by the buyer and now counts in the evaluation.' : 'Waiting for the vendor to reply. The low-confidence value stays out of the evaluation.'}</p><button class="btn soft" type="button" data-action="flag-reopen" data-id="${sel.id}">${icon('undo', 'sm')} Reopen flag</button>`}
      </div>
    </div>` : `<div class="card"><div class="card-b"><p class="note ok">${icon('task_alt', 'sm')}<span>No extraction flags. Every received line is above the confidence threshold.</span></p></div></div>`;

  const cv = vendorById(S.clar.vendor), cl = lineById(S.clar.line);
  const clarBusy = RT.busy.clar;
  const clar = `<div class="card" id="clar-card">
    <div class="card-h" style="background:var(--surface-2)"><h2>${icon('help')} Request vendor clarification ${openFlags.length ? `<span class="chip bad">${plural(openFlags.length, 'unresolved flag')}</span>` : ''}</h2><span class="muted" style="font-size:12.5px">Standard SLA: 24 h response</span></div>
    <div class="card-b"><div class="form-grid">
      <label class="field"><span>Target vendor</span><select class="select" id="clar-vendor" data-clar="vendor">${invitedVendors().map(x => `<option value="${x.id}" ${x.id === S.clar.vendor ? 'selected' : ''}>${esc(x.name)} (${esc(x.vendorId)})</option>`).join('')}</select></label>
      <label class="field"><span>Disputed line item</span><select class="select" id="clar-line" data-clar="line">${lines.map(l => `<option value="${l.id}" ${l.id === S.clar.line ? 'selected' : ''}>Line ${l.id.slice(1)}: ${esc(l.name)}</option>`).join('')}</select></label>
      <label class="field full"><span style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">Clarification message <span class="muted" style="font-weight:400">Logged to the RFx evaluation audit trail</span></span>
        <textarea class="textarea" id="clar-text" rows="7" data-clar="text" placeholder="Write the question for the vendor, or let Claude draft it from the flag.">${esc(S.clar.text)}</textarea></label>
    </div>${aiNotice()}</div>
    <div class="efoot"><span class="muted" style="font-size:12px">${icon('lock', 'sm')} Prototype: logging records the request here; no email is sent.</span>
      <div class="r">
        ${clarBusy ? `<button class="btn" type="button" data-action="clar-stop">${icon('stop_circle', 'sm')} Stop</button>` : `<button class="btn" type="button" data-action="clar-draft" ${aiUsable() ? '' : 'disabled'}>${icon('auto_awesome', 'sm')} Draft with Claude</button>`}
        <button class="btn ghost" type="button" data-action="clar-copy">${icon('content_copy', 'sm')} Copy</button>
        <button class="btn dark" type="button" data-action="clar-log" ${clarBusy ? 'disabled' : ''}>${icon('send', 'sm')} Log clarification request</button>
      </div></div>
  </div>`;

  return pageHead({
    ico: 'query_stats', title: 'Vendor Analyser',
    chips: `<span class="chip dark">#${esc(S.eventId)}</span>`,
    sub: `${esc(S.rfx.title)} · ${plural(ev.rows.length, 'invited vendor')}`,
    actions: `<button class="btn ghost" type="button" data-action="va-pick">${icon('arrow_back', 'sm')} All RFx</button><button class="btn" type="button" data-action="views-open">${icon('bookmarks', 'sm')} Saved views${VIEWS.list.length ? ` (${VIEWS.list.length})` : ''}</button>
      <button class="btn dark" type="button" data-action="view-save" ${ev.rows.some(r => !r.pending) ? '' : 'disabled title="Extract at least one vendor quote first"'}>${icon('bookmark_add', 'sm')} Save view</button>`
  }) + `<div class="wrap content">${draftNotice()}
    <div><div class="sec-h"><div><span class="caps" style="color:var(--accent-text)">Intake pipeline</span><h2 style="font-size:19px;font-weight:700;letter-spacing:-.01em">Vendor quotation intake & extraction</h2></div></div>
    <div class="intake">${intake}</div></div>

    <div class="card filters">
      <label class="switch"><input type="checkbox" id="f-qual" data-ui-toggle="qualifiedOnly" ${S.ui.qualifiedOnly ? 'checked' : ''}> Qualified vendors only</label>
      <label class="switch"><input type="checkbox" id="f-comp" data-ui-toggle="completeOnly" ${S.ui.completeOnly ? 'checked' : ''}> Complete quotes only</label>
      <span class="grow"></span>
      <label class="search" style="flex:0 1 260px"><span class="ms" style="color:var(--muted)">search</span><span class="sr">Filter line items</span><input id="mx-filter" type="search" data-ui-filter placeholder="Filter line items, specs…" value="${esc(S.ui.filter)}" style="background:var(--surface-2);color:var(--fg);border-color:var(--border)"></label>
      ${AI.downloads ? `<button class="btn soft" type="button" data-action="export-csv">${icon('download', 'sm')} Export CSV</button>` : ''}
    </div>

    <div class="g-side">
      <div class="card">
        <div class="card-h"><h2>${icon('table_view')} Normalised line-item matrix <span class="muted" style="font-weight:400;font-size:13px">${plural(shownLines.length, 'line')}</span></h2><span class="legend"><span><span class="l1b" style="margin:0">L1</span> lowest valid rate</span><span><span class="lr" style="margin:0">L2</span><span class="lr" style="margin:0">L3</span> next lowest</span><span><span class="fxb" style="margin:0">USD</span> converted to ₹</span></span></div>
        <div class="tblwrap"><table class="tbl mx">
          <thead><tr><th>Sl#</th><th>Item description & spec</th><th class="r">Qty</th><th class="l1h">L1 · lowest valid</th>${head}</tr></thead>
          <tbody>${body || `<tr><td colspan="${4 + cols.length}" class="muted">No line items match "${esc(S.ui.filter)}".</td></tr>`}</tbody>
        </table></div>
        <div class="card-f"><span class="legend"><span><i style="background:var(--ok-strong)"></i>High confidence</span><span><i style="background:var(--warn-strong)"></i>OCR variance</span><span><i style="background:var(--bad-strong)"></i>Low, excluded until reviewed</span><span><i style="background:var(--info)"></i>Buyer verified</span></span><span>Rates in ₹ per unit, ex-GST. L-ranks compare qualified vendors' reviewed rates on each line.</span></div>
      </div>
      ${audit}
    </div>
    ${clar}
  </div>`;
}

/* ---------- Decision Maker ---------- */
function renderDecision(ev) {
  const lines = ev.lines, budget = S.rfx.budget;
  const waitNote = ev.awaiting.length ? `<div class="note warn">${icon('schedule', 'sm')}<span><b>${plural(ev.awaiting.length, 'line')} added by amendment ${ev.awaiting.length === 1 ? 'has' : 'have'} no quotes yet:</b> ${ev.awaiting.map(l => esc(l.name)).join(', ')}. ${ev.awaiting.length === 1 ? 'It is' : 'They are'} left out of this award; award separately once quotes arrive.</span></div>` : '';
  const best = ev.best;
  const quoted = ev.rows.filter(r => !r.pending);
  const sorted = [...quoted].sort((a, b) => (b.qualified - a.qualified) || (b.complete - a.complete) || (a.total - b.total));
  const summary = sorted.map(r => {
    let rec;
    if (!r.qualified) rec = `<span style="color:var(--bad)">Not eligible</span>`;
    else if (!r.complete) rec = `<span class="muted">Partial quote</span>`;
    else if (best && r.v.id === best.v.id) rec = `<span class="chip accent">${icon('star', 'fill')}Recommended</span>`;
    else rec = `<span class="muted">+${pct(r.total / best.total - 1)} over lowest</span>`;
    return `<tr>
      <td class="c">${(() => { const k = ev.eligible.findIndex(e => e.v.id === r.v.id) + 1; return k ? `<span class="${k === 1 ? 'l1b' : 'lr'}" style="margin:0">L${k}</span>` : '<span class="muted">—</span>'; })()}</td>
      <td><div class="item-name" style="${r.qualified ? '' : 'color:var(--muted)'}">${esc(r.v.name)}</div><div class="item-spec">${esc(r.v.vendorId)}</div></td>
      <td class="r tnum" style="font-weight:600;${r.qualified ? '' : 'color:var(--bad)'}">${r.qualified ? inr(r.total) : 'Disqualified'}</td>
      <td class="c tnum">${r.count}/${lines.length} <span class="muted">(${Math.round(r.count / lines.length * 100)}%)</span></td>
      <td>${r.qualified ? `<span class="chip ok">${icon('verified')}Qualified</span>` : `<span class="chip bad">${icon('cancel')}${r.v.iso === false ? 'Missing ISO' : 'Unverified'}</span>`}</td>
      <td class="r tnum">${r.score != null ? r.score.toFixed(1) : '—'}</td>
      <td class="r">${rec}</td>
    </tr>`;
  }).join('');

  const barRows = quoted.filter(r => r.qualified && r.complete).sort((a, b) => a.total - b.total);
  const maxT = Math.max(1, ...barRows.map(r => r.total), ev.splitTotal, budget);
  const canSplit = ev.splitVendors.length > 1 && !ev.unallocated.length;
  const bars = `${canSplit ? `<div class="bar-row hero"><div class="lab"><span>${icon('auto_awesome', 'sm')} Split award (${ev.splitVendors.map(id => esc(vendorById(id).name.split(' ')[0])).join(' + ')})</span><b>${lakh(ev.splitTotal)}</b></div><div class="bar-track"><div class="bar-fill split" style="width:${ev.splitTotal / maxT * 100}%"></div></div>${best ? `<span class="chip ok" style="justify-self:start">${pct(ev.splitSavings / best.total)} below best single source</span>` : ''}</div>` : ''}
    ${barRows.map((r, i) => `<div class="bar-row"><div class="lab"><span>${esc(r.v.name)} ${i === 0 ? '<span class="muted">(lowest single source)</span>' : ''}</span><b>${lakh(r.total)}</b></div><div class="bar-track"><div class="bar-fill ${i === 0 ? 'best' : ''}" style="width:${r.total / maxT * 100}%"></div></div></div>`).join('')}
    ${budget ? '' : '<!--'}<div class="bar-row"><div class="lab"><span class="muted">Benchmark budget (prior-half PO mean)</span><b class="muted">${lakh(budget)}</b></div><div class="bar-track"><div class="bar-fill" style="width:${budget / maxT * 100}%;opacity:.35"></div></div></div>${budget ? '' : '-->'}`;

  const groups = {};
  for (const a of ev.alloc) if (a.vendor) (groups[a.vendor.id] ||= []).push(a);
  const alloc = Object.entries(groups).map(([vid, items]) => `<div class="acard"><div class="h"><b>${esc(vendorById(vid).name)}</b><span class="chip">${plural(items.length, 'line')}</span></div>
    <ul>${items.map(a => `<li><span>${esc(a.line.id.slice(1))} · ${esc(a.line.name)}</span><span class="tnum">${rateFmt(a.rate)}</span></li>`).join('')}</ul>
    <div class="sub"><span class="caps">Allocated subtotal</span><b class="tnum">${inr(items.reduce((s, a) => s + a.amount, 0))}</b></div></div>`).join('');

  const terms = quoted.filter(r => r.v.paymentDays != null).sort((a, b) => b.wc - a.wc).map(r => `<tr><td class="item-name">${esc(r.v.name)}</td><td>Net ${r.v.paymentDays} days</td><td class="tnum"><span class="meter"><i class="${r.wc >= 85 ? '' : r.wc >= 70 ? 'mid' : 'lo'}" style="width:${r.wc}%"></i></span>${r.wc} / 100</td><td class="r">${r.wc >= 85 ? '<span class="chip ok">Optimal liquidity</span>' : r.wc >= 70 ? '<span class="chip">Acceptable</span>' : '<span class="chip warn">Sub-optimal</span>'}</td></tr>`).join('');

  const busy = RT.busy.analyst;
  const chips = ['Who is cheapest overall?', 'Split the order by cheapest per line (qualified only)', 'Compare payment terms', 'Which vendors quoted all lines?', 'What is the risk of single-sourcing?'];
  const award = S.award;
  const proposal = award || proposedAward(ev, S.awardChoice);
  const needsDual = (proposal?.total || 0) > 2500000;
  const approvalsOk = !needsDual || (S.approvals.cpo.ok && S.approvals.fin.ok);
  const fin = S.approvals.fin;

  return pageHead({
    ico: 'balance', title: 'Executive procurement analytics & award scenarios',
    chips: `<span class="chip dark">#${esc(S.eventId)}</span>`,
    sub: `${esc(S.rfx.title)} · ${plural(quoted.length, 'quote')} received · scoring weights 60% price, 20% compliance, 20% payment terms`,
    actions: `<span class="live">Evaluation recalculates as quotes change</span><button class="btn" type="button" data-action="open-log">${icon('receipt_long', 'sm')} Decision log</button>`
  }) + `<div class="wrap content">${draftNotice()}<div class="g-side">
    <div class="stack">
      <div class="card">
        <div class="card-h"><h2>${icon('table_chart')} Evaluated vendor quotations</h2><span class="muted" style="font-size:12px">Rank = L1, L2… by total among complete, qualified quotes · updated ${fmtTime(new Date().toISOString())} IST</span></div>
        <div class="tblwrap"><table class="tbl"><thead><tr><th class="c" title="Rank by total among complete, qualified quotes">Rank</th><th>Vendor</th><th class="r">Total cost</th><th class="c">Lines quoted</th><th>Qualified?</th><th class="r">Score</th><th class="r">Recommendation</th></tr></thead><tbody>${summary || '<tr><td colspan="7" class="muted">No quotes received yet.</td></tr>'}</tbody></table></div>
      </div>

      <div class="card">
        <div class="card-h"><h2>${icon('bar_chart')} Total cost comparison by scenario</h2><span class="muted" style="font-size:12px">Bars start at ₹0</span></div>
        <div class="card-b bars">${barRows.length ? bars : '<p class="muted">No complete, qualified quote yet.</p>'}</div>
        <div class="card-f"><span class="caps">${budget ? `Benchmark ${lakh(budget)}` : 'No benchmark set'}</span>${best && budget ? `<span class="caps" style="color:var(--ok)">Best single source is ${pct(1 - best.total / budget)} under benchmark</span>` : ''}</div>
      </div>

      <div class="card">
        <div class="card-h"><h2>${icon('call_split')} Line-by-line optimal allocation</h2><span class="muted" style="font-size:12px">Cheapest qualified, reviewed rate per line</span></div>
        <div class="card-b stack" style="gap:14px">
          ${canSplit && best ? `<div class="recbox"><div style="display:flex;gap:10px">${icon('shield', 'lg')}<div><b>Split award ${ev.splitSavings > 0 ? 'saves more' : 'does not save more'} than single sourcing</b><p class="muted" style="font-size:12.5px">Spreads volume across ${plural(ev.splitVendors.length, 'qualified supplier')} for supply-risk hedging.</p></div></div><div style="text-align:right"><span class="caps" style="color:var(--ok)">Net incremental savings</span><div class="big tnum">${inr(ev.splitSavings)}</div></div></div>` : ''}
          ${ev.unallocated.length ? `<div class="note warn">${icon('warning', 'sm')}<span>${plural(ev.unallocated.length, 'line')} ha${ev.unallocated.length === 1 ? 's' : 've'} no qualified, reviewed rate yet: ${ev.unallocated.map(a => esc(a.line.name)).join(', ')}.</span></div>` : ''}
          <div class="alloc">${alloc || '<p class="muted">No allocations yet.</p>'}</div>
          <div class="kv" style="font-size:15px;border-top:1px solid var(--border);padding-top:12px"><span>Combined net award value</span><span class="tnum" style="font-size:19px">${inr(ev.splitTotal)}</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-h"><h2>${icon('account_balance')} Payment terms & working-capital impact</h2></div>
        <div class="tblwrap"><table class="tbl"><thead><tr><th>Vendor</th><th>Credit terms</th><th>Working-capital score</th><th class="r">Cash-flow index</th></tr></thead><tbody>${terms}</tbody></table></div>
      </div>
    </div>

    <div class="stack">
      <div class="card${S.ui.analystMin ? ' min' : ''}" style="display:flex;flex-direction:column">
        <div class="chat-h"><span class="ico">${icon('psychology')}</span><div style="flex:1"><b>Ask the AI analyst</b><small>Claude · answers from this event's data</small></div>${S.chat.analyst.length && !S.ui.analystMin ? `<button class="iconbtn" type="button" data-action="analyst-clear" title="Clear conversation">${icon('restart_alt')}</button>` : ''}<button class="iconbtn" type="button" data-action="analyst-toggle" title="${S.ui.analystMin ? 'Expand' : 'Minimise'} AI analyst">${icon(S.ui.analystMin ? 'expand_more' : 'expand_less')}</button></div>
        ${S.ui.analystMin ? '' : `<div class="card-b" style="padding:10px 14px;border-bottom:1px solid var(--border)"><div class="sugs">${chips.map(c => `<button class="sug" type="button" data-action="analyst-suggest" data-text="${esc(c)}" ${busy || !aiUsable() ? 'disabled' : ''}>${esc(c)}</button>`).join('')}</div></div>
        <div class="chat-log" id="analyst-log" style="max-height:480px;min-height:160px">${renderChatLog(S.chat.analyst, 'analyst') || `<p class="muted" style="font-size:13px">Pick a question above or ask your own. Claude sees the quotes, compliance status, allocation and payment terms on this page.</p>`}</div>
        <form class="chat-in" data-form="analyst">
          <label class="sr" for="analyst-input">Ask a procurement question</label>
          <div style="display:flex;gap:8px"><input class="input" id="analyst-input" placeholder="Ask any procurement analytics question…" autocomplete="off" ${busy ? 'disabled' : ''}>
          ${busy ? `<button class="btn" type="button" data-action="analyst-stop">${icon('stop_circle', 'sm')} Stop</button>` : `<button class="btn primary" type="submit" ${aiUsable() ? '' : 'disabled'}>${icon('send', 'sm')} Send</button>`}</div>
          ${aiNotice()}
        </form>`}
      </div>

      <div class="card">
        <div class="card-h"><h2>${icon('gavel')} Award execution</h2><span class="caps">Step 3 of 4</span></div>
        <div class="card-b stack" style="gap:12px">
          ${award ? `<div class="note ok">${icon('task_alt', 'sm')}<span><b>Award finalised ${fmtDT(award.at)}.</b> ${award.mode === 'split' ? `Split across ${plural(award.vendorIds.length, 'vendor')}` : esc(vendorById(award.vendorIds[0]).name)} for ${inr(award.total)}.</span></div>
            <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-tab="email">${icon('mail', 'sm')} Compose award notices</button><button class="btn ghost" type="button" data-action="award-undo">${icon('undo', 'sm')} Reopen evaluation</button></div>` : `
          ${waitNote}
          <div class="opts">
            <label class="opt"><input type="radio" name="award-choice" id="aw-single" value="single" data-award-choice ${S.awardChoice === 'single' ? 'checked' : ''} ${best ? '' : 'disabled'}><span class="ot"><b>Single source${best ? `: ${esc(best.v.name)}` : ''}</b>${best ? `${inr(best.total)} · one contract, one supplier` : 'No complete, qualified quote yet'}</span></label>
            <label class="opt"><input type="radio" name="award-choice" id="aw-split" value="split" data-award-choice ${S.awardChoice === 'split' ? 'checked' : ''} ${canSplit ? '' : 'disabled'}><span class="ot"><b>Split award (${plural(ev.splitVendors.length, 'vendor')})</b>${canSplit ? `${inr(ev.splitTotal)} · cheapest qualified rate per line` : 'Needs a qualified rate on every line'}</span></label>
          </div>

function startDate() { return new Date(new Date(S.rfx.issued.deadline).getTime() + 12 * 864e5).toISOString(); }
function recipientFacts(ctx, vid) {

/* ---------- Render loop ---------- */
const RENDERERS = { rfx: renderRfx, vendors: renderVendors, decision: renderDecision, email: renderEmail };
function render() {
  if (!S) return;
  const ev = evaluate();
  const a = document.activeElement;
  const focusId = a && a.id && a !== document.body ? a.id : null;
  const selStart = focusId && 'selectionStart' in a ? safeSel(a) : null;
  const logs = $$('.chat-log').map(el => [el.id, el.scrollTop, el.scrollHeight - el.scrollTop - el.clientHeight < 40]);
  renderHeader(ev);
  const host = $('#tab-' + W.tab);
  host.innerHTML = RENDERERS[W.tab](ev);
  for (const [id, top, atBottom] of logs) { const el = id && $('#' + id); if (el) el.scrollTop = atBottom ? el.scrollHeight : top; }
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && !el.disabled) { el.focus({ preventScroll: true }); if (selStart && el.setSelectionRange) try { el.setSelectionRange(selStart[0], selStart[1]); } catch (e) { /* not a text input */ } }
  }
  RT.flashLines.clear(); RT.flashFields.clear();
  save();
}
function safeSel(el) { try { return el.selectionStart == null ? null : [el.selectionStart, el.selectionEnd]; } catch (e) { return null; } }
function scrollLog(id) { const el = $('#' + id); if (el) el.scrollTop = el.scrollHeight; }

function setTab(tab) {
  if (!RENDERERS[tab]) return;
  W.tab = tab;
  render();
  window.scrollTo({ top: 0 });
  try { history.replaceState(null, '', '#' + tab); } catch (e) { /* sandboxed */ }
}

      <label class="field full"><span>Delivery location</span><select class="select" id="nl-site">${[...new Set(S.rfx.lines.map(l => l.site).concat(['Bhiwandi Central DC', 'Bangalore Fulfilment Hub', 'Manesar Hub', 'Chennai Plant']))].map(s => `<option>${esc(s)}</option>`).join('')}</select></label>
    </div><p class="muted" id="nl-err" style="font-size:12.5px"></p>`,
    actions: [cancelBtn, { label: 'Add line', cls: 'primary', run: () => {
      const name = $('#nl-name').value.trim(), qty = parseInt($('#nl-qty').value.replace(/[^\d]/g, ''), 10);
      if (!name || !qty) { $('#nl-err').textContent = 'Enter an item name and a quantity above zero.'; return; }
      const id = nextLineId();
      S.rfx.lines.push({ id, name, spec: $('#nl-spec').value.trim() || 'Specification to be confirmed', uom: $('#nl-uom').value, qty, site: $('#nl-site').value });
      S.rfx.dirty = true; S.ui.showAllLines = true; RT.flashLines.add(id); log(`Added line ${id} (${name})`); closeModal(); render();
    } }]
  }),
  'vendor-remove': el => { const v = vendorById(el.dataset.id); S.invited = S.invited.filter(x => x !== el.dataset.id); S.rfx.dirty = true; log(`Removed ${v.name} from distribution`); render(); },
  'vendor-add': () => openModal({
    title: 'Add vendor to distribution',
    body: `<div class="form-grid">${S.vendors.filter(v => !S.invited.includes(v.id)).length ? `<label class="field full"><span>Previously invited vendor</span><select class="select" id="nv-existing"><option value="">Choose…</option>${S.vendors.filter(v => !S.invited.includes(v.id)).map(v => `<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select></label><p class="full muted" style="font-size:12px">Or add a new vendor:</p>` : ''}
      <label class="field"><span>Company name</span><input class="input" id="nv-name" placeholder="e.g. Kraftline Packaging"></label>
      <label class="field"><span>Bid email</span><input class="input" id="nv-email" type="email" placeholder="tenders@example.in"></label></div><p class="muted" id="nv-err" style="font-size:12.5px"></p>`,
    actions: [cancelBtn, { label: 'Add vendor', cls: 'primary', run: () => {
      const ex = $('#nv-existing')?.value;
      if (ex) { S.invited.push(ex); log(`Re-added ${vendorById(ex).name} to distribution`); }
      else {
        const name = $('#nv-name').value.trim(), email = $('#nv-email').value.trim();
        if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { $('#nv-err').textContent = 'Enter a company name and a valid email address.'; return; }
        addVendor({ name, email });
      }
      S.rfx.dirty = true; closeModal(); render();
    } }]
  }),
  'save-draft': () => { save(); toast('Draft saved in this browser.'); },
  'dispatch': () => {
    const n = invitedVendors().length, isDraft = S.stage === 'draft';
    const missing = [];
    if (!S.rfx.title.trim()) missing.push('Give the RFx a title.');
    if (!S.rfx.lines.length) missing.push('Add at least one line item.');
    const bad = S.rfx.lines.filter(l => !l.name.trim() || !(l.qty > 0));
    if (bad.length) missing.push(`Give every line an item name and a quantity (line ${bad.map(l => S.rfx.lines.indexOf(l) + 1).join(', ')}).`);
    if (!n) missing.push('Invite at least one vendor.');
    if (new Date(S.rfx.deadline) <= Date.now()) missing.push('Set a response deadline in the future.');
    if (missing.length) { openModal({ title: isDraft ? 'Finish these before sending' : 'Finish these before issuing', body: `<ul style="margin:0;padding-left:18px;display:grid;gap:6px">${missing.map(m => `<li>${esc(m)}</li>`).join('')}</ul>`, actions: [{ label: 'OK', cls: 'dark', run: closeModal }] }); return; }
    openModal({
      title: isDraft ? 'Send RFx to vendors?' : `Issue amendment ${S.rfx.revision + 1}?`,
      body: `<p>${isDraft ? 'The RFx goes' : `Revision ${S.rfx.revision + 1} goes`} to ${plural(n, 'vendor')}: ${invitedVendors().map(v => esc(v.name)).join(', ')}.</p><p class="note">${icon('info', 'sm')}<span>Prototype: this records the dispatch in the audit log. No email or portal invitation is sent.</span></p>`,
      actions: [cancelBtn, { label: icon('send', 'sm') + (isDraft ? ' Send RFx' : ' Issue amendment'), cls: 'primary', run: () => {
        S.rfx.revision += 1; S.rfx.dirty = false;
        const dc = draftChanges();
        S.rfx.issued = issuedSnapshot(S.rfx);
        if (!isDraft && dc.any) log(`Revision ${S.rfx.revision} applied to evaluation: ${dc.text}`);
        if (isDraft) { S.stage = 'published'; S.rfx.issuedAt = new Date().toISOString(); }
        log(`${isDraft ? 'Sent RFx' : 'Issued amendment'} revision ${S.rfx.revision} to ${plural(n, 'vendor')}`);
        closeModal(); render(); toast(`Revision ${S.rfx.revision} issued to ${plural(n, 'vendor')}. Every tab now uses it${dc.added.length ? `; ${plural(dc.added.length, 'new line')} await${dc.added.length === 1 ? 's' : ''} vendor quotes` : ''}.`);
      } }]
    });
  },

  // Vendor analyser
  'select-flag': el => { S.ui.selFlag = el.dataset.id; const f = S.flags.find(x => x.id === el.dataset.id); if (f) { S.clar.vendor = f.vendor; S.clar.line = f.line; } render(); },
  'flag-approve': el => {
    const f = S.flags.find(x => x.id === el.dataset.id); if (!f) return;
    const val = parseFloat(($('#flag-rate')?.value || '').replace(/[^\d.]/g, ''));
    if (!(val > 0)) { toast('Enter a rate above zero to approve.', true); return; }
    const c = S.quotes[f.vendor][f.line];
    const changed = c.rate !== val;
    c.rate = val; c.conf = 'verified'; f.status = 'approved';
    log(`Approved ${vendorById(f.vendor).name} line ${f.line.slice(1)} at ${rateFmt(val)}${changed ? ' (corrected)' : ''}`);
    render(); toast(`Line ${f.line.slice(1)} for ${vendorById(f.vendor).name} now counts at ${rateFmt(val)}.`);
  },
  'flag-reopen': el => { const f = S.flags.find(x => x.id === el.dataset.id); if (!f) return; f.status = 'open'; const c = S.quotes[f.vendor]?.[f.line]; if (c) c.conf = f.severity; log(`Reopened flag ${f.id}`); render(); },
  'flag-clarify': el => {
    const f = S.flags.find(x => x.id === el.dataset.id); if (!f) return;
    S.clar.vendor = f.vendor; S.clar.line = f.line; render();
    $('#clar-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('#clar-text')?.focus({ preventScroll: true });
  },
  'clar-copy': () => copyText(S.clar.text, 'Clarification copied.'),
  'clar-log': () => {
    if (!S.clar.text.trim()) { toast('Write or draft the message first.', true); return; }
    const v = vendorById(S.clar.vendor), f = S.flags.find(x => x.vendor === S.clar.vendor && x.line === S.clar.line && x.status === 'open');
    if (f) f.status = 'clarification';
    log(`Logged clarification request to ${v.name} on line ${S.clar.line.slice(1)}`);
    S.clar.text = '';
    render(); toast(`Clarification to ${v.name} logged. No email was sent from this prototype.`);
  },
  'export-csv': async () => {
    const ev = evaluate(), rows = ev.rows.filter(r => !r.pending);
    const cell = s => `"${String(s).replace(/"/g, '""')}"`;
    const csv = [['Line', 'Item', 'Spec', 'UoM', 'Qty', ...rows.map(r => r.v.name + ' (INR/unit)'), 'L1 vendor'].map(cell).join(',')]
      .concat(issuedLines().map(l => [l.id, l.name, l.spec, l.uom, l.qty, ...rows.map(r => S.quotes[r.v.id]?.[l.id]?.rate ?? ''), ev.l1[l.id] ? vendorById(ev.l1[l.id]).name : ''].map(cell).join(','))).join('\r\n');
    try { await AI.downloads.save({ filename: `${S.eventId}_line_item_matrix.csv`, data: csv }); toast('CSV saved.'); }
    catch (e) { if (e?.code !== 'declined') toast("The CSV couldn't be saved in this view.", true); }
  },

  // Decision maker
  'approve-fin': () => { S.approvals.fin = { ...S.approvals.fin, ok: true, at: new Date().toISOString() }; log('Recorded finance approval (simulated)', S.approvals.fin.by); render(); },
  'award': () => {
    const ev = evaluate(), p = proposedAward(ev, S.awardChoice); if (!p) return;
    openModal({
      title: 'Execute award?',
      body: `<p>Award <b>${inr(p.total)}</b> ${p.mode === 'split' ? `across ${p.vendorIds.map(id => esc(vendorById(id).name)).join(', ')}` : `to <b>${esc(vendorById(p.vendorIds[0]).name)}</b>`}.</p><p class="muted" style="font-size:12.5px">This locks the evaluation and prepares ${plural(p.vendorIds.length, 'award notice')} and regret notices for the other bidders. You can reopen it from Decision Maker.</p>${ev.awaiting.length ? `<p class="note warn">${icon('schedule', 'sm')}<span>Not included: ${ev.awaiting.map(l => esc(l.name)).join(', ')} (awaiting quotes).</span></p>` : ''}`,
      actions: [cancelBtn, { label: icon('gavel', 'sm') + ' Execute award', cls: 'primary', run: () => {
        S.award = { ...p, provisional: false, at: new Date().toISOString() };
        S.stage = 'awarded'; S.email.recipient = p.vendorIds[0];
        log(`Executed ${p.mode === 'split' ? 'split' : 'single-source'} award for ${inr(p.total)}`);
        closeModal(); setTab('email'); toast('Award executed. Review the notices.');
      } }]
    });
  },
  'award-undo': () => { S.award = null; S.stage = 'evaluation'; log('Reopened evaluation; award withdrawn'); render(); },

  // Email
  'email-recipient': el => { S.email.recipient = el.dataset.id; render(); },
  'cc-remove': el => { S.email.cc.splice(+el.dataset.i, 1); render(); },
  'email-reset': () => { const ctx = emailContext(); if (!ctx) return; S.email.drafts[draftKey(ctx, ctx.sel)] = { ...templateDraft(ctx, ctx.sel), status: 'draft', by: 'template' }; render(); },
  'email-copy': () => {
    const ctx = emailContext(); if (!ctx) return; const d = getDraft(ctx, ctx.sel), v = vendorById(ctx.sel.id);
    copyText(`To: ${v.email}\nCc: ${S.email.cc.join(', ')}\nSubject: ${resolveTokens(d.subject, ctx, ctx.sel)}\n\n${resolveTokens(d.body, ctx, ctx.sel)}`, 'Email copied with merge tokens filled in.');
  },
  'email-send': () => {
    const ctx = emailContext(); if (!ctx) return; const v = vendorById(ctx.sel.id);
    openModal({
      title: 'Log this notice as sent?',
      body: `<p>Mark the ${ctx.sel.kind} notice to <b>${esc(v.name)}</b> &lt;${esc(v.email)}&gt; as sent.</p><p class="note">${icon('info', 'sm')}<span>Prototype: nothing leaves this page. Use <b>Copy email</b> to send it from your mail client, then log it here.</span></p>`,
      actions: [cancelBtn, { label: icon('done', 'sm') + ' Log as sent', cls: 'primary', run: () => {
        const d = getDraft(ctx, ctx.sel); d.status = 'sent'; d.sentAt = new Date().toISOString();
        log(`Logged ${ctx.sel.kind} notice to ${v.name} as sent`);
        if (ctx.list.every(x => S.email.drafts[draftKey(ctx, x)]?.status === 'sent')) { S.stage = 'notified'; log('All award and regret notices logged'); }
        const next = ctx.list.find(x => S.email.drafts[draftKey(ctx, x)]?.status !== 'sent'); if (next) S.email.recipient = next.id;
        closeModal(); render(); toast(`Notice to ${v.name} logged.`);
      } }]
    });
  }
};

function confirmReset() {
  openModal({
    title: 'Reset example data?',
    body: '<p>This clears your edits, extractions, chats and award in this browser and restores the example event.</p>',
    actions: [cancelBtn, { label: 'Reset', cls: 'primary', run: () => { for (const k in RT.ctl) RT.ctl[k]?.abort(); W = seedWorkspace(); S = activeEvent(); closeModal(); render(); toast('Example data restored.'); } }]
  });
}
function nextLineId() { let n = S.rfx.lines.reduce((m, l) => Math.max(m, parseInt(l.id.slice(1), 10) || 0), 0) + 1; return 'L' + String(n).padStart(2, '0'); }
function addVendor({ name, email }) {
  const id = 'V' + (S.vendors.reduce((m, v) => Math.max(m, parseInt(v.id.slice(1), 10) || 0), 0) + 1);
  S.vendors.push({ id, name: name.slice(0, 80), email: email.slice(0, 120), contact: 'Tender desk', vendorId: 'VEND-NEW-' + String(Math.floor(Math.random() * 9e4) + 1e4), tier: 2, iso: null, source: 'Awaiting file', srcIcon: 'hourglass_top', paymentDays: null, esg: 'Pending' });
  S.invited.push(id);
  log(`Added ${name} to distribution`);
  return id;
}
async function copyText(text, ok) {
  try { await navigator.clipboard.writeText(text); toast(ok); }
  catch (e) {
    openModal({ title: 'Copy text', body: `<p class="muted" style="font-size:12.5px">Copying is blocked here. Select the text below and copy it.</p><textarea class="textarea" id="copy-fallback" rows="12" readonly>${esc(text)}</textarea>`, actions: [{ label: 'Done', cls: 'dark', run: closeModal }] });
    $('#copy-fallback').select();
  }
}

/* ---------- Several RFx: list, picker, switching ---------- */
function openEvent(id, tab) {
  for (const k in RT.ctl) RT.ctl[k]?.abort();
  RT.flashLines.clear(); RT.flashFields.clear();
  W.activeId = id; S = activeEvent();
  if (tab === 'vendors') W.ui.vaPick = false;
  setTab(tab || W.tab);
}

/* One summary row per RFx, computed in that RFx's own context. */
function eventSummary(e) {
  return withEvent(e, () => {
    const ev = evaluate();
    const quoted = ev.rows.filter(r => !r.pending).length;
    const flags = S.flags.filter(f => f.status === 'open' && lineById(f.line) && S.invited.includes(f.vendor)).length;
    const value = S.award ? S.award.total : ev.best ? ev.best.total : null;
    return { e, quoted, invited: S.invited.length, flags, rem: remaining(), value, valueLabel: S.award ? 'Awarded' : ev.best ? 'Lowest complete quote' : '' };
  });
}
const stagePill = e => `<span class="st ${e.stage}">${STAGES[e.stage]}</span>`;
function closesCell(x) {
  if (x.e.stage === 'draft') return `<span class="muted">Due ${fmtDate(x.e.rfx.deadline)}</span>`;
  return x.rem ? `<b class="tnum">${x.rem.d}d ${String(x.rem.h).padStart(2, '0')}h</b><div class="muted small">${fmtDate(x.e.rfx.issued.deadline)}</div>` : `<span class="muted">Closed ${fmtDate(x.e.rfx.issued.deadline)}</span>`;
}

function renderList() {
  const status = W.ui.listStatus || 'all', q = (W.ui.listQuery || '').trim().toLowerCase();
  const all = W.events.map(eventSummary);
  const counts = { all: all.length };
  for (const x of all) counts[x.e.stage] = (counts[x.e.stage] || 0) + 1;
  const shown = all.filter(x => (status === 'all' || x.e.stage === status) && (!q || `${x.e.eventId} ${x.e.rfx.title} ${x.e.rfx.category}`.toLowerCase().includes(q)));
  const segs = [['all', 'All'], ['draft', 'Draft'], ['published', 'Sourcing'], ['evaluation', 'Evaluation'], ['awarded', 'Awarded'], ['notified', 'Notified']].filter(([k]) => k === 'all' || counts[k]);
  const rows = shown.map(x => {
    const e = x.e, draft = e.stage === 'draft';
    return `<tr class="clickrow${e.eventId === W.activeId ? ' current' : ''}" data-action="open-event" data-id="${e.eventId}" tabindex="0">
      <td><b class="tnum">${esc(e.eventId)}</b><div class="muted small">${esc(e.rfx.type)}</div></td>
      <td><div class="item-name">${esc(e.rfx.title || 'Untitled RFx')}</div><div class="item-spec">${esc(e.rfx.category || 'No category')} · ${plural(e.rfx.lines.length, 'line')}</div></td>
      <td>${stagePill(e)}</td>
      <td>${draft ? `<span class="muted">${x.invited ? plural(x.invited, 'vendor') + ' to invite' : 'No vendors yet'}</span>` : `<div class="prog"><span class="meter"><i style="width:${x.invited ? Math.round(x.quoted / x.invited * 100) : 0}%"></i></span><span class="tnum">${x.quoted}/${x.invited}</span></div>${x.flags ? `<div class="small" style="color:var(--bad)">${plural(x.flags, 'flag')} to review</div>` : ''}`}</td>
      <td>${closesCell(x)}</td>
      <td class="r">${x.value != null ? `<b class="tnum">${lakh(x.value)}</b><div class="muted small">${x.valueLabel}</div>` : '<span class="muted">—</span>'}</td>
      <td class="r nowrap"><button class="btn sm" type="button" data-action="open-event" data-id="${e.eventId}">${draft ? 'Continue' : 'Open'}</button>
        <button class="btn sm ${draft ? 'ghost' : 'dark'}" type="button" data-action="analyse-event" data-id="${e.eventId}" ${draft ? 'disabled title="Send the RFx to analyse quotes"' : ''}>Analyse</button></td>
    </tr>`;
  }).join('');
  return pageHead({
    ico: 'list_alt', title: 'RFx List',
    actions: `<button class="btn primary" type="button" data-action="rfx-new">${icon('add', 'sm')} New RFx</button>`
  }) + `<div class="wrap content">
    <div class="list-bar">
      <div class="seg" role="group" aria-label="Filter by status">${segs.map(([k, t]) => `<button type="button" data-action="list-status" data-status="${k}" aria-pressed="${status === k}">${t} <span class="n">${counts[k] || 0}</span></button>`).join('')}</div>
      <label class="search" style="flex:0 1 300px"><span class="ms" style="color:var(--muted)">search</span><span class="sr">Search RFx</span><input id="list-q" type="search" data-list-q placeholder="Search RFx number, title, category" value="${esc(W.ui.listQuery || '')}" style="background:var(--surface);color:var(--fg);border-color:var(--border)"></label>
    </div>
    <div class="card"><div class="tblwrap"><table class="tbl list">
      <thead><tr><th>RFx</th><th>Title</th><th>Status</th><th>Quotes</th><th>Closes</th><th class="r">Value</th><th class="r"><span class="sr">Actions</span></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="7" class="muted" style="padding:20px 16px">No RFx match these filters.</td></tr>`}</tbody>
    </table></div></div>
  </div>`;
}

function renderPicker() {
  const issued = W.events.filter(e => e.stage !== 'draft').map(eventSummary);
  const drafts = W.events.length - issued.length;
  const rows = issued.map(x => `<tr class="clickrow${x.e.eventId === W.activeId ? ' current' : ''}" data-action="analyse-event" data-id="${x.e.eventId}" tabindex="0">
      <td><b class="tnum">${esc(x.e.eventId)}</b></td>
      <td><div class="item-name">${esc(x.e.rfx.title)}</div><div class="item-spec">${esc(x.e.rfx.category || '')} · ${plural(x.e.rfx.issued.lines.length, 'line')}</div></td>
      <td>${stagePill(x.e)}</td>
      <td><div class="prog"><span class="meter"><i style="width:${x.invited ? Math.round(x.quoted / x.invited * 100) : 0}%"></i></span><span class="tnum">${x.quoted} of ${x.invited} received</span></div></td>
      <td>${x.flags ? `<span class="chip bad">${plural(x.flags, 'flag')}</span>` : '<span class="muted">None</span>'}</td>

      <thead><tr><th>RFx</th><th>Title</th><th>Status</th><th>Quotes</th><th>To review</th><th>Closes</th><th><span class="sr">Open</span></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="7" class="muted" style="padding:20px 16px">No RFx has been sent to vendors yet.</td></tr>'}</tbody>
    </table></div>${drafts ? `<div class="card-f"><span>${plural(drafts, 'draft')} not shown. Drafts appear here once they’re sent to vendors.</span><button class="linkbtn" type="button" data-tab="list">View all RFx</button></div>` : ''}</div></div>`;
}

function renderNotIssued(what) {

    + `<div class="wrap content"><div class="card"><div class="card-b empty-state">
      ${icon('hourglass_top', 'lg')}
      <h2>${esc(S.rfx.title || 'This RFx')} hasn’t been sent to vendors yet</h2>

    </div></div></div>`;
}

{

const nextId = (list, prefix) => prefix + (list.reduce((m, x) => Math.max(m, parseInt(String(x.id).slice(prefix.length), 10) || 0), 0) + 1);

Object.assign(ACTIONS, {
  'open-event': el => openEvent(el.dataset.id, 'rfx'),
  'analyse-event': el => openEvent(el.dataset.id, 'vendors'),
  'rfx-new': () => { const e = newEvent(); W.events.unshift(e); S.ui && (S.ui.copilotMin = false); openEvent(e.eventId, 'rfx'); setTimeout(() => $('#copilot-input')?.focus(), 0); },
  'va-pick': () => { W.ui.vaPick = true; render(); window.scrollTo({ top: 0 }); },
  'list-status': el => { W.ui.listStatus = el.dataset.status; render(); },
  'jump': el => document.getElementById(el.dataset.to)?.scrollIntoView({ behavior: 'smooth', block: 'start' }),
  'clause-add': () => {
    const id = 'C' + String(S.rfx.clauses.reduce((m, c) => Math.max(m, parseInt(c.id.slice(1), 10) || 0), 0) + 1).padStart(2, '0');
    S.rfx.clauses.push({ id, category: 'General', question: '', detail: '', mandatory: true, expected: '' });
