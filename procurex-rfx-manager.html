/* ---------- Saved views: named snapshots of the evaluation, private to each person ---------- */
const VIEWS = { list: [], mode: 'pending', db: null, uid: null, confirm: null };
const VIEWS_LS = 'procurex-rfx-views-v1';
const MAX_VIEW_BYTES = 240 * 1024;

const viewsCol = () => VIEWS.db.doc('data/users/' + VIEWS.uid + '/procurex').collection('views');
function loadLocalViews() {
  try { const a = JSON.parse(localStorage.getItem(VIEWS_LS) || '[]'); VIEWS.list = Array.isArray(a) ? a : []; } catch (e) { VIEWS.list = []; }
  VIEWS.list.sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
}
/* A full browser store throws so the caller can say so; a browser that blocks storage keeps views for this visit. */
function persistLocalViews() {
  try { localStorage.setItem(VIEWS_LS, JSON.stringify(VIEWS.list)); }
  catch (e) { if (e && e.name === 'QuotaExceededError') throw e; VIEWS.mode = 'session'; }
}
function refreshViews() {
  const b = $('#views-body'); if (b) b.innerHTML = viewsListHtml();
  if (S && S.tab === 'vendors' && !RT.busy.clar) render();
}

(async () => {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.('db') ?? null, window.claude?.use?.('user') ?? null]);
    const uid = user ? await user.id() : null;
    if (db && uid) {
      Object.assign(VIEWS, { db, uid, mode: 'account' });
      viewsCol().orderBy('savedAt', 'desc').limit(100).onSnapshot(
        snap => { VIEWS.list = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshViews(); },
        () => { VIEWS.mode = 'local'; loadLocalViews(); refreshViews(); }
      );
      return;
    }
  } catch (e) { /* no account storage here: fall back to this browser */ }
  VIEWS.mode = 'local'; loadLocalViews(); refreshViews();
})();

/* What a view keeps: everything that shapes the evaluation. Chats stay out to keep views small. */
function viewSnapshot() {
  const st = clone(S);
  st.chat = { rfx: [], analyst: [] };
  st.audit = st.audit.slice(-40);
  const bytes = o => new TextEncoder().encode(JSON.stringify(o)).length;
  if (bytes(st) > MAX_VIEW_BYTES) st.rawQuotes = {};
  if (bytes(st) > MAX_VIEW_BYTES) st.email.drafts = {};
  return bytes(st) > MAX_VIEW_BYTES ? null : st;
}
const whereViews = () => VIEWS.mode === 'account' ? 'Saved to your Claude account, private to you.'
  : VIEWS.mode === 'local' ? 'Saved in this browser only. Open the page on claude.ai, signed in, to keep views in your account.'
  : VIEWS.mode === 'session' ? 'This browser blocks storage here, so views last only until you close the page. Open it on claude.ai to keep them.' : 'Checking where views are stored…';

function viewsListHtml() {
  if (!VIEWS.list.length) return `<p class="muted" style="font-size:12.5px">${whereViews()}</p><p>No saved views yet. Once at least one vendor's quote is extracted, use <b>Save view</b> to keep this evaluation and come back to it later.</p>`;
  return `<p class="muted" style="font-size:12.5px">${whereViews()}</p><div class="vlist">${VIEWS.list.map(v => {
    const c = VIEWS.confirm;
    const acts = c === v.id + ':open'
      ? `<span class="muted" style="font-size:12px">Replace your current work?</span><button class="btn sm primary" type="button" data-action="view-load" data-id="${esc(v.id)}">Open view</button><button class="btn sm ghost" type="button" data-action="view-cancel">Cancel</button>`
      : c === v.id + ':del'
      ? `<span class="muted" style="font-size:12px">Delete this view?</span><button class="btn sm primary" type="button" data-action="view-delete" data-id="${esc(v.id)}">Delete</button><button class="btn sm ghost" type="button" data-action="view-cancel">Cancel</button>`
      : `<button class="btn sm" type="button" data-action="view-ask" data-kind="open" data-id="${esc(v.id)}">${icon('folder_open', 'sm')} Open</button><button class="btn sm ghost" type="button" data-action="view-ask" data-kind="del" data-id="${esc(v.id)}" title="Delete view">${icon('delete', 'sm')}<span class="sr">Delete</span></button>`;
    return `<div class="vrow"><div class="vm"><b>${esc(v.name)}</b><small>${v.savedAt ? fmtDT(v.savedAt) : ''} · ${plural(v.vendorsQuoted || 0, 'vendor')} quoted · ${plural(v.lineCount || 0, 'line')}${v.bestVendor ? ` · lowest ${esc(v.bestVendor)} ${lakh(v.bestTotal)}` : ''} · ${esc(STAGES[v.stage] || '')}</small></div><div class="va">${acts}</div></div>`;
  }).join('')}</div>`;
}

async function saveView() {
  const st = $('#view-save-status'), go = $('#view-save-go');
  const name = (($('#view-name')?.value || '').trim() || 'Untitled view').slice(0, 80);
  const snap = viewSnapshot();
  if (!snap) { st.innerHTML = `<p class="note bad">${icon('error', 'sm')}<span>This evaluation is too large to save as one view. Remove long pasted quote texts and try again.</span></p>`; return; }
  const ev = evaluate(), quoted = ev.rows.filter(r => !r.pending);
  const doc = { name, savedAt: new Date().toISOString(), eventId: S.eventId, title: S.rfx.title, vendorsQuoted: quoted.length, vendorNames: quoted.map(r => r.v.name), lineCount: issuedLines().length, bestVendor: ev.best ? ev.best.v.name : null, bestTotal: ev.best ? Math.round(ev.best.total) : null, stage: S.stage, state: snap };
  go.disabled = true;
  try {
    if (VIEWS.mode === 'account') await viewsCol().doc().set(doc);
    else if (VIEWS.mode === 'pending') throw new Error('not_ready');
    else { VIEWS.list.unshift({ id: 'v' + Date.now().toString(36), ...doc }); persistLocalViews(); }
    log(`Saved view "${name}"`);
    closeModal(); render(); toast(`View "${name}" saved.`);
  } catch (e) {
    if (VIEWS.mode === 'local') loadLocalViews();
    if (e?.message === 'not_ready') { st.innerHTML = `<p class="note warn">${icon('info', 'sm')}<span>Still connecting to your saved views. Try again in a few seconds.</span></p>`; go.disabled = false; return; }
    const msg = e?.code === 'quota_exceeded' ? 'Saved views are full. Delete a few old views, then save again.'
      : e?.code === 'invalid_argument' ? "Your access to this page doesn't allow saving views."
      : e?.name === 'QuotaExceededError' ? "This browser's storage is full. Delete a few old views, then save again."
      : "The view couldn't be saved. Try again.";
    st.innerHTML = `<p class="note bad">${icon('error', 'sm')}<span>${msg}</span></p>`;
    go.disabled = false;
  }
}

    if (!st) { toast("This view couldn't be opened. It may be from an older version.", true); return; }
    for (const k in RT.ctl) RT.ctl[k]?.abort();
    S = st; S.tab = 'vendors'; VIEWS.confirm = null;
    log(`Opened saved view "${v.name}"`);
    closeModal(); render(); toast(`Opened "${v.name}".`);
  },
  'view-delete': async el => {
    const v = VIEWS.list.find(x => x.id === el.dataset.id); if (!v) return;
    try {
      if (VIEWS.mode === 'account') await viewsCol().doc(v.id).delete();
      else { VIEWS.list = VIEWS.list.filter(x => x.id !== v.id); persistLocalViews(); }
      VIEWS.confirm = null; refreshViews(); toast(`Deleted "${v.name}".`);
    } catch (e) { toast("The view couldn't be deleted. Try again.", true); }
  }
};

/* ---------- Event wiring ---------- */
const AI_ACTIONS = {
  'copilot-suggest': el => copilotSend(el.dataset.text),
  'copilot-stop': () => RT.ctl.copilot?.abort(),
  'copilot-clear': () => { RT.ctl.copilot?.abort(); S.chat.rfx = []; render(); },
  'upload': el => openUpload(el.dataset.id),
  'clar-draft': clarDraft,
  'clar-stop': () => RT.ctl.clar?.abort(),
  'analyst-suggest': el => analystAsk(el.dataset.text),
  'analyst-stop': () => RT.ctl.analyst?.abort(),
  'analyst-clear': () => { RT.ctl.analyst?.abort(); S.chat.analyst = []; render(); },
  'email-ai': emailDraft,
  'email-stop': () => RT.ctl.email?.abort(),
  'fx-confirm': () => { S.fx.asOf = todayIST(); log(`Confirmed USD rate ₹${S.fx.rates.USD} for ${todayIST()}`); if (RT.upload) RT.upload.needCur = null; const st = $('#up-status'); if (st) st.innerHTML = ''; refreshFx(); save(); }
};

document.addEventListener('click', e => {
  const m = e.target.closest('[data-modal]');
  if (m) { RT.modalHandlers[m.dataset.modal]?.(); return; }
  if (e.target === $('#modal')) { closeModal(); return; }
  const t = e.target.closest('[data-tab]');
  if (t) { setTab(t.dataset.tab); return; }
  const a = e.target.closest('[data-action]');
  if (!a || a.disabled) return;
  const fn = ACTIONS[a.dataset.action] || AI_ACTIONS[a.dataset.action] || VIEW_ACTIONS[a.dataset.action];
  if (fn) { e.preventDefault(); fn(a); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
  const cell = e.target.closest?.('td[data-action]');
  if (cell && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ACTIONS[cell.dataset.action]?.(cell); return; }
  if (e.target.id === 'copilot-input' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const v = e.target.value; e.target.value = ''; copilotSend(v); return; }
  if (e.target.matches?.('[data-cc-add]') && e.key === 'Enter') {
    e.preventDefault();
    const v = e.target.value.trim();
    if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { if (!S.email.cc.includes(v)) S.email.cc.push(v); e.target.value = ''; render(); $('#cc-add')?.focus(); }
    else toast('Enter a valid email address.', true);
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'copilot') { const i = $('#copilot-input'); const v = i.value; i.value = ''; copilotSend(v); }
  if (f.dataset.form === 'analyst') { const i = $('#analyst-input'); const v = i.value; i.value = ''; analystAsk(v); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'global-search') { S.ui.filter = el.value; if (S.tab !== 'vendors') { S.tab = 'vendors'; } render(); return; }
  if (el.matches('[data-ui-filter]')) { S.ui.filter = el.value; $('#global-search').value = el.value; render(); return; }
  if (el.matches('[data-clar]') && el.dataset.clar === 'text') { S.clar.text = el.value; save(); return; }
  if (el.matches('[data-email]')) {
    const ctx = emailContext(); if (!ctx) return;
    getDraft(ctx, ctx.sel)[el.dataset.email] = el.value;
    if (el.dataset.email === 'body') { const c = $('#email-count'); if (c) c.textContent = el.value.length.toLocaleString('en-IN') + ' characters'; }
    save();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-bind]')) {
    const [obj, key] = el.dataset.bind.split('.');
    const val = el.value.trim();
    if (val && S[obj][key] !== val) { S[obj][key] = val; S.rfx.dirty = true; log(`Edited ${key === 'title' ? 'RFx title' : key}`); }
    render(); return;
  }
  if (el.matches('[data-bind-num]')) {
    const n = parseInt(el.value.replace(/[^\d]/g, ''), 10);
    if (n > 0 && n !== S.rfx.validityDays) { S.rfx.validityDays = n; S.rfx.dirty = true; log(`Set quote validity to ${n} days`); }
    render(); return;
  }
  if (el.matches('[data-deadline]')) {
    if (el.value) { S.rfx.deadline = fromISTInput(el.value); S.rfx.dirty = true; log(`Moved deadline to ${fmtDT(S.rfx.deadline)}`); }
    render(); return;
  }
  if (el.matches('[data-line-qty]')) {
    const l = draftLineById(el.dataset.lineQty), n = parseInt(el.value.replace(/[^\d]/g, ''), 10);
    if (l && n > 0 && n !== l.qty) { log(`Changed ${l.id} quantity from ${l.qty.toLocaleString('en-IN')} to ${n.toLocaleString('en-IN')}`); l.qty = n; S.rfx.dirty = true; RT.flashLines.add(l.id); }
    render(); return;
  }
  if (el.matches('[data-clause-mand]')) { const c = S.rfx.clauses.find(x => x.id === el.dataset.clauseMand); c.mandatory = el.checked; S.rfx.dirty = true; render(); return; }
  if (el.matches('[data-clause-exp]')) { const c = S.rfx.clauses.find(x => x.id === el.dataset.clauseExp); if (c.expected !== el.value.trim()) { c.expected = el.value.trim(); S.rfx.dirty = true; } render(); return; }
  if (el.matches('[data-ui-toggle]')) { S.ui[el.dataset.uiToggle] = el.checked; render(); return; }
  if (el.matches('[data-clar]') && el.dataset.clar !== 'text') { S.clar[el.dataset.clar] = el.value; render(); return; }
  if (el.matches('[data-award-choice]')) { S.awardChoice = el.value; render(); return; }
  if (el.matches('[data-email-tone]')) { S.email.tone = el.value; save(); return; }
  if (el.matches('[data-merge]')) {
    const tok = el.value; el.value = ''; if (!tok) return;
    const ta = $('#email-body'); if (!ta || ta.readOnly) return;
    const s = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? s;
    ta.value = ta.value.slice(0, s) + tok + ta.value.slice(en);
    ta.focus(); ta.setSelectionRange(s + tok.length, s + tok.length);
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'up-file') { handleQuoteFile(e.target.files[0]); e.target.value = ''; }
  if (e.target.matches?.('[data-fx]')) {
    const c = e.target.dataset.fx, n = parseFloat(e.target.value.replace(/[^d.]/g, ''));
    if (n > 0) S.fx.rates[c] = Math.round(n * 10000) / 10000; else delete S.fx.rates[c];
    S.fx.asOf = todayIST(); S.fx.note = 'Set by buyer';
    log(n > 0 ? `Set ${c} rate to ₹${S.fx.rates[c]} for ${todayIST()}` : `Cleared ${c} rate`);
    if (RT.upload && RT.upload.needCur === c && n > 0) { RT.upload.needCur = null; const st = $('#up-status'); if (st) st.innerHTML = ''; }
    refreshFx(); save();
  }
});
for (const type of ['dragenter', 'dragover']) document.addEventListener(type, e => { const d = e.target.closest?.('#up-drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest?.('#up-drop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const d = e.target.closest?.('#up-drop');
  if (!d) { if (!$('#modal').hidden) e.preventDefault(); return; }
  e.preventDefault(); d.classList.remove('over');
  const f = e.dataTransfer?.files?.[0]; if (f) handleQuoteFile(f);
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (RENDERERS[h] && h !== S.tab) setTab(h); });

/* ---------- Boot ---------- */
function start(data) {
  S = migrate(data) || loadState();
  const h = location.hash.slice(1);
  if (RENDERERS[h]) S.tab = h;
  $('#global-search').value = S.ui.filter || '';
  render();
  setInterval(() => { if (S) { $('#closing').textContent = remainingText(); } }, 60000);
}
try { window.claude?.hot?.snapshot?.(() => S); } catch (e) { /* not in a viewer */ }
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
