function applyCopilot(res) {
  const changes = [];
  const str = (v, max = 300) => typeof v === 'string' ? v.trim().slice(0, max) : '';
  const r = S.rfx;
  if (res.header && typeof res.header === 'object') {
    const h = res.header; let n = 0;
    const set = (k, v) => { if (v !== undefined && v !== '' && v !== r[k]) { r[k] = v; RT.flashFields.add(k); n++; } };
    if ('title' in h) set('title', str(h.title, 120));
    if (['RFQ', 'RFP', 'RFI'].includes(h.type)) set('type', h.type);
    if ('category' in h) set('category', str(h.category, 80));
    if ('businessUnit' in h) set('businessUnit', str(h.businessUnit, 80));
    if ('summary' in h) set('summary', str(h.summary, 400));
    if (['INR', 'USD', 'EUR'].includes(h.currency)) set('currency', h.currency);
    if ('deliveryTerms' in h) set('deliveryTerms', str(h.deliveryTerms, 120));
    if ('paymentTerms' in h) set('paymentTerms', str(h.paymentTerms, 120));
    const vd = Math.round(Number(h.validityDays)); if (vd > 0 && vd < 1000) set('validityDays', vd);
    const d = h.deadline ? new Date(h.deadline) : null;
    if (d && !isNaN(d)) set('deadline', d.toISOString());
    if (n) changes.push(n === 1 && RT.flashFields.has('deadline') ? 'Deadline moved to ' + fmtDT(r.deadline) : `${plural(n, 'detail')} filled`);
  }
  if (Array.isArray(res.lines)) {
    const before = new Map(r.lines.map(l => [l.id, JSON.stringify(l)]));
    const used = new Set(), next = [];
    const fallbackNeed = istDate(plusDays(r.deadline, 21));
    for (const raw of res.lines.slice(0, 60)) {
      if (!raw || typeof raw !== 'object') continue;
      const name = str(raw.name, 120), qty = Math.round(Number(String(raw.qty).replace(/[^\d.]/g, '')));
      if (!name || !(qty > 0)) continue;
      let id = /^L\d{2,3}$/.test(raw.id) && !used.has(raw.id) ? raw.id : null;
      if (!id) id = nextLineIdFrom([...r.lines, ...next]);
      used.add(id);
      const needBy = /^\d{4}-\d{2}-\d{2}$/.test(raw.needBy) ? raw.needBy : (before.has(id) ? JSON.parse(before.get(id)).needBy : fallbackNeed);
      next.push({ id, name, spec: str(raw.spec, 240) || 'Specification to be confirmed', uom: str(raw.uom, 16) || 'Units', qty, site: str(raw.site, 80) || r.lines[0]?.site || SITES[0], needBy });
    }
    const added = next.filter(l => !before.has(l.id)).length;
    const removed = [...before.keys()].filter(id => !next.some(l => l.id === id)).length;
    const edited = next.filter(l => before.has(l.id) && before.get(l.id) !== JSON.stringify(l));
    if (added || removed || edited.length) {
      r.lines = next;
      for (const l of next) if (!before.has(l.id) || before.get(l.id) !== JSON.stringify(l)) RT.flashLines.add(l.id);
      if (added) changes.push(`${plural(added, 'line')} added`);
      if (edited.length) changes.push(`${plural(edited.length, 'line')} edited`);
      if (removed) changes.push(`${plural(removed, 'line')} removed`);
    }
  }
  if (Array.isArray(res.clauses)) {
    const before = JSON.stringify(r.clauses);
    const next = res.clauses.slice(0, 20).filter(c => c && str(c.question)).map((c, i) => ({
      id: /^C\d{2}$/.test(c.id) ? c.id : 'C' + String(i + 1).padStart(2, '0'),
      category: str(c.category, 60) || 'General', question: str(c.question, 240), detail: str(c.detail, 300), mandatory: c.mandatory !== false, expected: str(c.expected, 120)
    }));
    if (JSON.stringify(next) !== before) { r.clauses = next; changes.push(`${plural(next.length, 'supplier question')}`); }
  }
  if (typeof res.notes === 'string' && res.notes.trim() !== r.notes) { r.notes = res.notes.trim().slice(0, 2000); RT.flashFields.add('notes'); changes.push('Notes updated'); }
  if (Array.isArray(res.terms)) {
    const before = JSON.stringify(r.terms);
    const next = res.terms.slice(0, 20).filter(t => t && str(t.title)).map((t, i) => ({ id: /^T\d{1,2}$/.test(t.id) ? t.id : 'T' + (i + 1), title: str(t.title, 80), text: str(t.text, 400), include: t.include !== false }));
    if (next.length && JSON.stringify(next) !== before) { r.terms = next; changes.push('Terms updated'); }
  }
  if (Array.isArray(res.vendors)) {
    const keep = [];
    for (const v of res.vendors.slice(0, 20)) {
      if (!v || typeof v !== 'object') continue;
      const known = S.vendors.find(x => x.id === v.id) || S.vendors.find(x => x.name.toLowerCase() === str(v.name).toLowerCase());
      if (known) { keep.push(known.id); continue; }
      const name = str(v.name, 80), email = str(v.email, 120);
      if (name && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { const id = addVendor({ name, email }); S.invited = S.invited.filter(x => x !== id); keep.push(id); }
    }
    const before = new Set(S.invited), after = new Set(keep);
    const added = [...after].filter(id => !before.has(id)).length, removed = [...before].filter(id => !after.has(id)).length;
    if (added) changes.push(`${plural(added, 'vendor')} invited`);
    if (removed) changes.push(`${plural(removed, 'vendor')} removed`);
    if (added || removed) S.invited = [...after];
  }
  return changes;
}
function nextLineIdFrom(list) { const n = list.reduce((m, l) => Math.max(m, parseInt(l.id.slice(1), 10) || 0), 0) + 1; return 'L' + String(n).padStart(2, '0'); }

/* ---------- Quote files: PDF, Excel, text and images are read in the page ---------- */
const LIBS = {
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
};
const scriptLoads = {};
function loadScript(src) {
  return scriptLoads[src] ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = resolve;
    s.onerror = () => { delete scriptLoads[src]; s.remove(); reject(new Error('reader_unavailable')); };
    document.head.append(s);
  });
}
const IMG_EXT = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
const SHEET_EXT = ['xlsx', 'xls', 'xlsm', 'xlsb', 'ods'];
const TEXT_EXT = ['csv', 'tsv', 'txt', 'eml', 'md', 'json', 'xml', 'htm', 'html'];
const MAX_TEXT = 60000;
const fileSize = n => n < 1048576 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1048576).toFixed(1) + ' MB';
const extOf = name => (name.split('.').pop() || '').toLowerCase();

async function readQuoteFile(file) {
  const ext = extOf(file.name);
  if (file.type.startsWith('image/') || IMG_EXT.includes(ext)) return { text: '', images: [file], summary: `${file.name} (${fileSize(file.size)}) will be sent to Claude as an image.` };
  if (ext === 'pdf' || file.type === 'application/pdf') return readPdf(file);
  if (SHEET_EXT.includes(ext)) return readSheet(file);
  if (TEXT_EXT.includes(ext) || file.type.startsWith('text/')) {
    let text = await file.text();
    if (ext === 'htm' || ext === 'html') text = new DOMParser().parseFromString(text, 'text/html').body.textContent || '';
    return { text, images: [], summary: `Read ${file.name}: ${plural(text.split('\n').filter(x => x.trim()).length, 'line')} of text.` };
  }
  throw new Error(`${file.name} isn't a supported file type. Use a PDF, Excel, CSV or text file, or a JPG or PNG image.`);
}

async function readSheet(file) {
  await loadScript(LIBS.xlsx);
  const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
  let rows = 0;
  const parts = wb.SheetNames.slice(0, 8).map(n => {
    const csv = window.XLSX.utils.sheet_to_csv(wb.Sheets[n], { blankrows: false }).replace(/,+$/gm, '');
    rows += csv.split('\n').filter(x => x.replace(/,/g, '').trim()).length;
    return `## Sheet: ${n}\n${csv}`;
  });
  return { text: parts.join('\n\n'), images: [], summary: `Read ${file.name}: ${plural(wb.SheetNames.length, 'sheet')}, ${plural(rows, 'row')}.` };
}

async function readPdf(file) {
  await loadScript(LIBS.pdf);
  // The worker script also loads on the page itself: artifact pages can't start a worker from a CDN.
  await loadScript(LIBS.pdfWorker);
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false, disableFontFace: true }).promise;
  const pages = Math.min(doc.numPages, 15);
  const texts = [];
  for (let i = 1; i <= pages; i++) {
    const page = await doc.getPage(i);
    texts.push(`## Page ${i}\n` + pdfLines((await page.getTextContent()).items));
  }
  const text = texts.join('\n\n');
  const more = doc.numPages > pages ? ` (first ${pages} of ${doc.numPages})` : '';
  if (text.replace(/## Page \d+/g, '').replace(/\s/g, '').length >= 30 * pages) return { text, images: [], summary: `Read ${file.name}: ${plural(pages, 'page')} of text${more}.` };
  // A scanned PDF has no text layer: render its pages to images for Claude to read.
  const n = Math.min(pages, AI.maxImages || 0, 5);
  if (!n) throw new Error(`${file.name} is a scanned PDF with no text layer, and this view can't send images to Claude. Paste the quote text instead.`);
  const images = [];
  for (let i = 1; i <= n; i++) {
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale: Math.min(2.5, 1600 / page.getViewport({ scale: 1 }).width) });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    images.push(await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9)));
  }
  return { text: '', images, summary: `${file.name} is a scan: ${plural(n, 'page')} will be sent to Claude as images${doc.numPages > n ? ` (first ${n} of ${doc.numPages})` : ''}.` };
}

/* Rebuilds reading-order lines from pdf.js text items: group by baseline, then left to right. */
function pdfLines(items) {
  const rows = [];
  for (const it of items) {
    if (!it.str || !it.str.trim()) continue;
    const x = it.transform[4], y = it.transform[5];
    let row = rows.find(r => Math.abs(r.y - y) <= 3);
    if (!row) rows.push(row = { y, cells: [] });
    row.cells.push({ x, s: it.str, w: it.width || 0 });
  }
  rows.sort((a, b) => b.y - a.y);
  return rows.map(r => {
    r.cells.sort((a, b) => a.x - b.x);
    let out = '', end = null;
    for (const c of r.cells) { if (end != null) out += c.x - end > 12 ? '   ' : c.x - end > 1 ? ' ' : ''; out += c.s; end = c.x + c.w; }
    return out.trim();
  }).filter(Boolean).join('\n');
}

function sourceLabel(file) {
  if (!file) return ['Pasted text', 'content_paste'];
  const ext = extOf(file.name);
  if (ext === 'pdf') return ['PDF (.pdf)', 'picture_as_pdf'];
  if (SHEET_EXT.includes(ext)) return [`Excel (.${ext})`, 'table'];
  if (ext === 'csv' || ext === 'tsv') return [`Spreadsheet (.${ext})`, 'table'];
  if (ext === 'eml') return ['Email quote (.eml)', 'mail'];
  if (IMG_EXT.includes(ext) || file.type.startsWith('image/')) return [`Photo / scan (.${ext})`, 'photo_camera'];
  return [`Text file (.${ext})`, 'description'];
}

  if (images.length && !text && !AI.images) { say('warn', "This view can't send images to Claude. Open the page on claude.ai, or paste the quote text."); return; }
  const sample = await getSample(); if (!sample) return;
  const go = $('#up-go'); go.disabled = true;
  status.innerHTML = `<div class="note">${thinking('Claude is reading the quotation')}</div>`;
  const ctl = RT.ctl.upload = new AbortController();
  const lines = issuedLines().map(({ id, name, spec, uom, qty }) => ({ id, name, spec, uom, qty }));
  const sendImages = AI.images ? images.slice(0, AI.maxImages || 1) : [];
  const prompt = `You extract supplier quotations for Procure-X, a procurement tool used in India. Map the vendor's quoted unit prices onto the buyer's RFx line items.

RFx line items (JSON):
${JSON.stringify(lines)}

Vendor: ${v.name}
${text ? `Quotation${file ? ` (from ${file.name})` : ''}:\n"""\n${text}\n"""` : ''}${sendImages.length ? `\nThe quotation${text ? ' is also' : ' is'} attached as ${plural(sendImages.length, 'image')}.` : ''}

Rules:
- currency: the ISO 4217 code the prices are quoted in. ₹, Rs, Rs. and INR are "INR"; $ and US$ are "USD"; € is "EUR"; £ is "GBP". If no currency is shown, use "INR".
- rate: the price for one unit of the RFx line's unit of measure, IN THE QUOTED CURRENCY, exactly as quoted (do not convert currencies), excluding GST or VAT. Read Indian digit grouping ("1,20,000") correctly. If the quote prices per 100 or per 1,000 units, divide to get the per-unit price.
- Match by description and specification, not only by row order. Use null for a line the vendor did not quote.
- confidence: "high" when the price and its match are unambiguous; "medium" when the buyer should check something (extra charges, unclear units, partial match); "low" when the value is a guess.
- note: one short sentence for any medium or low line saying what to check; "" otherwise.

Reply with only a JSON object:
{"currency":"INR","lines":[{"lineId":"L01","rate":40.9,"confidence":"high","note":""}],"paymentTermsDays":45,"validityDays":60,"isoCertified":true,"summary":"one sentence"}
Use null for paymentTermsDays, validityDays or isoCertified when the quotation doesn't say.`;
  try {
    const opts = { signal: ctl.signal, modelTier: 'default', cache: false };
    if (sendImages.length) opts.images = sendImages;
    const res = await sample.json(prompt, opts);
    const cur = String(res?.currency || 'INR').trim().toUpperCase().slice(0, 3);
    const fx = cur === 'INR' ? 1 : Number(S.fx.rates[cur]);
    if (!(fx > 0) || (cur !== 'INR' && S.fx.asOf !== todayIST())) {
      RT.upload.needCur = cur; refreshFx();
      say('warn', !(fx > 0) ? `This quote is priced in ${cur}. Enter today's ₹ per 1 ${cur} rate above, then extract again.` : `This quote is priced in ${cur}. Confirm today's ₹ per 1 ${cur} rate above, then extract again.`);
      go.disabled = false; return;
    }
    const got = Array.isArray(res?.lines) ? res.lines : [];
    const q = {}; let n = 0; const newFlags = [];
    for (const x of got) {
      const l = lineById(x?.lineId); const r = Number(x?.rate);
      if (!l || !(r > 0)) continue;
      const conf = ['high', 'medium', 'low'].includes(x.confidence) ? x.confidence : 'medium';
      q[l.id] = { rate: Math.round(r * fx * 100) / 100, conf };
      if (cur !== 'INR') q[l.id].orig = { cur, rate: r, fx };
      n++;
      if (conf !== 'high') newFlags.push({ line: l.id, severity: conf, note: String(x.note || '').slice(0, 300), quoted: r });
    }
    if (!n) throw { code: 'empty_extraction' };
    S.quotes[vid] = q;
    S.flags = S.flags.filter(f => f.vendor !== vid);
    let fi = S.flags.reduce((m, f) => Math.max(m, parseInt(f.id.slice(1), 10) || 0), 0);
    for (const nf of newFlags) {
      const l = lineById(nf.line);
      // Show the source row that carries this rate, so the buyer can check it against the original.
      const row = text ? text.split('\n').find(x => x.includes(nf.quoted.toFixed(2)) || x.includes(String(nf.quoted))) : null;
      S.flags.push({ id: 'F' + (++fi), vendor: vid, line: nf.line, severity: nf.severity, status: 'open', file: file ? file.name : `${v.name.split(' ')[0]}_quote.txt`, confidence: nf.severity === 'low' ? 60 : 80,
        raw: '>>' + (row ? row.trim() : file ? `[${file.name}] ${l.name}` : l.name),
        reason: (nf.note || 'Claude marked this value for a buyer check.') + (cur !== 'INR' ? ` Quoted ${CUR_SYM[cur] || cur + ' '}${nf.quoted}, converted at ₹${fx}.` : '') });
    }
    if (typeof res.isoCertified === 'boolean') v.iso = res.isoCertified;
    if (Number(res.paymentTermsDays) > 0) v.paymentDays = Math.round(Number(res.paymentTermsDays));
    [v.source, v.srcIcon] = sourceLabel(file);
    v.quoteCur = cur; v.fxUsed = cur === 'INR' ? null : fx;
    if (v.esg === 'Pending') v.esg = v.iso ? 'ISO 14001' : 'Not declared';
    if (text) S.rawQuotes[vid] = text.slice(0, 20000);
    if (S.stage === 'published') S.stage = 'evaluation';
    log(`Claude extracted ${n}/${issuedLines().length} lines from ${v.name}${file ? ` (${file.name})` : ''}${cur !== 'INR' ? `, ${cur} converted at ₹${fx}` : ''}${newFlags.length ? `; ${plural(newFlags.length, 'line')} flagged` : ''}`, 'Claude (extraction)');
    RT.upload = null;
    closeModal(); render();
    toast(`${v.name}: ${n} of ${issuedLines().length} lines extracted${cur !== 'INR' ? ` and converted from ${cur}` : ''}${newFlags.length ? `, ${newFlags.length} flagged for review` : ''}.`);
  } catch (e) {
    aiFail(e);
    const msg = e?.code === 'empty_extraction' ? "Claude couldn't match any prices to your line items. Check that this is the vendor's quote for this RFx." : aiErrorText(e);
    if ($('#up-status')) { if (msg) say('bad', msg); else $('#up-status').innerHTML = ''; }
    if ($('#up-go')) $('#up-go').disabled = false;
  } finally { RT.ctl.upload = null; }
}

      quoteTotal: r.pending ? null : Math.round(r.total), linesQuoted: r.count, complete: r.complete, qualified: r.qualified,

    })),

async function analystAsk(q) {
  q = q.trim(); if (!q || RT.busy.analyst) return;

  const prior = S.chat.analyst.filter(m => !m.error && !m.pending).slice(-8);
  S.chat.analyst.push({ role: 'user', text: q, at: new Date().toISOString() });
  const id = 'an-' + Date.now();
  const pending = { role: 'assistant', text: '', pending: true, streamId: id, at: new Date().toISOString() };
  S.chat.analyst.push(pending);
  RT.busy.analyst = true; const ctl = RT.ctl.analyst = new AbortController();
  render(); scrollLog('analyst-log');
  const rules = `You are the procurement analyst inside Procure-X. Answer the lead buyer's questions about this RFx evaluation using only the data below. Amounts are INR: use ₹ with Indian digit grouping, and lakh (L) for large totals. Be direct: at most 160 words, short paragraphs or bullets, bold the key figure. Show the arithmetic briefly when you compare totals. If the data can't answer the question, say what is missing. Never invent vendors, rates or approvals.

Evaluation data (JSON):
${JSON.stringify(analystData())}`;
  const turns = [{ role: 'user', content: rules }, ...prior.map(m => ({ role: m.role, content: m.text })), { role: 'user', content: q }];
  try {
    const { text, truncated } = await sample(turns, {
      signal: ctl.signal, modelTier: 'default', cache: false,
      onText: ({ text }) => { const el = document.getElementById(id); if (el) { el.innerHTML = md(text); scrollLog('analyst-log'); } }
    });
    Object.assign(pending, { pending: false, text: text + (truncated ? '\n\n(Answer cut short. Ask a narrower question.)' : '') });
  } catch (e) {
    aiFail(e);
    const msg = aiErrorText(e);

  } finally {
    delete pending.streamId;
    RT.busy.analyst = false; RT.ctl.analyst = null; render(); scrollLog('analyst-log');
  }
}

/* ---------- Saved views: named snapshots of the evaluation, private to each person ---------- */
const VIEWS = { list: [], mode: 'pending', db: null, uid: null, confirm: null };
const VIEWS_LS = 'procurex-rfx-views-v1';
const MAX_VIEW_BYTES = 240 * 1024;

const viewsCol = () => VIEWS.db.doc('data/users/' + VIEWS.uid + '/procurex').collection('views');
function loadLocalViews() {
  try { const a = JSON.parse(localStorage.getItem(VIEWS_LS) || '[]'); VIEWS.list = Array.isArray(a) ? a : []; } catch (e) { VIEWS.list = []; }
  VIEWS.list.sort((a, b) => String(b.savedAt).localeCompare(String(a.savedAt)));
}
/* A full browser store throws so the caller can say so; a browser that blocks storage keeps views for this visit. */
function persistLocalViews() {
  try { localStorage.setItem(VIEWS_LS, JSON.stringify(VIEWS.list)); }
  catch (e) { if (e && e.name === 'QuotaExceededError') throw e; VIEWS.mode = 'session'; }
}
function refreshViews() {
  const b = $('#views-body'); if (b) b.innerHTML = viewsListHtml();
  if (S && W.tab === 'vendors' && !RT.busy.clar) render();
}

(async () => {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.('db') ?? null, window.claude?.use?.('user') ?? null]);
    const uid = user ? await user.id() : null;
    if (db && uid) {
      Object.assign(VIEWS, { db, uid, mode: 'account' });
      viewsCol().orderBy('savedAt', 'desc').limit(100).onSnapshot(
        snap => { VIEWS.list = snap.docs.map(d => ({ id: d.id, ...d.data() })); refreshViews(); },
        () => { VIEWS.mode = 'local'; loadLocalViews(); refreshViews(); }
      );
      return;
    }
  } catch (e) { /* no account storage here: fall back to this browser */ }
  VIEWS.mode = 'local'; loadLocalViews(); refreshViews();
})();

/* What a view keeps: everything that shapes the evaluation. Chats stay out to keep views small. */
function viewSnapshot() {
  const st = clone(S);
  st.chat = { rfx: [], analyst: [] };
  st.audit = st.audit.slice(-40);
  const bytes = o => new TextEncoder().encode(JSON.stringify(o)).length;
  if (bytes(st) > MAX_VIEW_BYTES) st.rawQuotes = {};
  if (bytes(st) > MAX_VIEW_BYTES) st.email.drafts = {};
  return bytes(st) > MAX_VIEW_BYTES ? null : st;
}
const whereViews = () => VIEWS.mode === 'account' ? 'Saved to your Claude account, private to you.'
  : VIEWS.mode === 'local' ? 'Saved in this browser only. Open the page on claude.ai, signed in, to keep views in your account.'
  : VIEWS.mode === 'session' ? 'This browser blocks storage here, so views last only until you close the page. Open it on claude.ai to keep them.' : 'Checking where views are stored…';

function viewsListHtml() {
  if (!VIEWS.list.length) return `<p class="muted" style="font-size:12.5px">${whereViews()}</p><p>No saved views yet. Once at least one vendor's quote is extracted, use <b>Save view</b> to keep this evaluation and come back to it later.</p>`;
  return `<p class="muted" style="font-size:12.5px">${whereViews()}</p><div class="vlist">${VIEWS.list.map(v => {
    const c = VIEWS.confirm;
    const acts = c === v.id + ':open'
      ? `<span class="muted" style="font-size:12px">Replace your current work?</span><button class="btn sm primary" type="button" data-action="view-load" data-id="${esc(v.id)}">Open view</button><button class="btn sm ghost" type="button" data-action="view-cancel">Cancel</button>`
      : c === v.id + ':del'
      ? `<span class="muted" style="font-size:12px">Delete this view?</span><button class="btn sm primary" type="button" data-action="view-delete" data-id="${esc(v.id)}">Delete</button><button class="btn sm ghost" type="button" data-action="view-cancel">Cancel</button>`
      : `<button class="btn sm" type="button" data-action="view-ask" data-kind="open" data-id="${esc(v.id)}">${icon('folder_open', 'sm')} Open</button><button class="btn sm ghost" type="button" data-action="view-ask" data-kind="del" data-id="${esc(v.id)}" title="Delete view">${icon('delete', 'sm')}<span class="sr">Delete</span></button>`;
    return `<div class="vrow"><div class="vm"><b>${esc(v.name)}</b><small>${v.savedAt ? fmtDT(v.savedAt) : ''} · ${plural(v.vendorsQuoted || 0, 'vendor')} quoted · ${plural(v.lineCount || 0, 'line')}${v.bestVendor ? ` · lowest ${esc(v.bestVendor)} ${lakh(v.bestTotal)}` : ''} · ${esc(STAGES[v.stage] || '')}</small></div><div class="va">${acts}</div></div>`;
  }).join('')}</div>`;
}

async function saveView() {
  const st = $('#view-save-status'), go = $('#view-save-go');
  const name = (($('#view-name')?.value || '').trim() || 'Untitled view').slice(0, 80);
  const snap = viewSnapshot();
  if (!snap) { st.innerHTML = `<p class="note bad">${icon('error', 'sm')}<span>This evaluation is too large to save as one view. Remove long pasted quote texts and try again.</span></p>`; return; }
  const ev = evaluate(), quoted = ev.rows.filter(r => !r.pending);
  const doc = { name, savedAt: new Date().toISOString(), eventId: S.eventId, title: S.rfx.title, vendorsQuoted: quoted.length, vendorNames: quoted.map(r => r.v.name), lineCount: issuedLines().length, bestVendor: ev.best ? ev.best.v.name : null, bestTotal: ev.best ? Math.round(ev.best.total) : null, stage: S.stage, state: snap };
  go.disabled = true;
  try {
    if (VIEWS.mode === 'account') await viewsCol().doc().set(doc);
    else if (VIEWS.mode === 'pending') throw new Error('not_ready');
    else { VIEWS.list.unshift({ id: 'v' + Date.now().toString(36), ...doc }); persistLocalViews(); }
    log(`Saved view "${name}"`);
    closeModal(); render(); toast(`View "${name}" saved.`);
  } catch (e) {
    if (VIEWS.mode === 'local') loadLocalViews();
    if (e?.message === 'not_ready') { st.innerHTML = `<p class="note warn">${icon('info', 'sm')}<span>Still connecting to your saved views. Try again in a few seconds.</span></p>`; go.disabled = false; return; }
    const msg = e?.code === 'quota_exceeded' ? 'Saved views are full. Delete a few old views, then save again.'
      : e?.code === 'invalid_argument' ? "Your access to this page doesn't allow saving views."
      : e?.name === 'QuotaExceededError' ? "This browser's storage is full. Delete a few old views, then save again."
      : "The view couldn't be saved. Try again.";
    st.innerHTML = `<p class="note bad">${icon('error', 'sm')}<span>${msg}</span></p>`;
    go.disabled = false;
  }
}

  'copilot-suggest': el => copilotSend(el.dataset.text),
  'copilot-stop': () => RT.ctl.copilot?.abort(),
  'copilot-clear': () => { RT.ctl.copilot?.abort(); S.chat.rfx = []; render(); },
  'upload': el => openUpload(el.dataset.id),
  'clar-draft': clarDraft,
  'clar-stop': () => RT.ctl.clar?.abort(),
  'analyst-suggest': el => analystAsk(el.dataset.text),
  'analyst-stop': () => RT.ctl.analyst?.abort(),
  'analyst-clear': () => { RT.ctl.analyst?.abort(); S.chat.analyst = []; render(); },
  'email-ai': emailDraft,
  'email-stop': () => RT.ctl.email?.abort(),
  'fx-confirm': () => { S.fx.asOf = todayIST(); log(`Confirmed USD rate ₹${S.fx.rates.USD} for ${todayIST()}`); if (RT.upload) RT.upload.needCur = null; const st = $('#up-status'); if (st) st.innerHTML = ''; refreshFx(); save(); }
};

document.addEventListener('click', e => {
  const m = e.target.closest('[data-modal]');
  if (m) { RT.modalHandlers[m.dataset.modal]?.(); return; }
  if (e.target === $('#modal')) { closeModal(); return; }
  const t = e.target.closest('[data-tab]');
  if (t) { if (t.dataset.tab === 'vendors') W.ui.vaPick = t.classList.contains('tab'); setTab(t.dataset.tab); return; }
  const a = e.target.closest('[data-action]');
  if (!a || a.disabled) return;
  const fn = ACTIONS[a.dataset.action] || AI_ACTIONS[a.dataset.action] || VIEW_ACTIONS[a.dataset.action];
  if (fn) { e.preventDefault(); fn(a); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
  const cell = e.target.matches?.('td[data-action], tr[data-action]') ? e.target : null;
  if (cell && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ACTIONS[cell.dataset.action]?.(cell); return; }
  if (e.target.id === 'copilot-input' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const v = e.target.value; e.target.value = ''; copilotSend(v); return; }
  if (e.target.matches?.('[data-cc-add]') && e.key === 'Enter') {
    e.preventDefault();
    const v = e.target.value.trim();
    if (/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { if (!S.email.cc.includes(v)) S.email.cc.push(v); e.target.value = ''; render(); $('#cc-add')?.focus(); }
    else toast('Enter a valid email address.', true);
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === 'copilot') { const i = $('#copilot-input'); const v = i.value; i.value = ''; copilotSend(v); }
  if (f.dataset.form === 'analyst') { const i = $('#analyst-input'); const v = i.value; i.value = ''; analystAsk(v); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'global-search') { S.ui.filter = el.value; W.ui.vaPick = false; if (W.tab !== 'vendors') { W.tab = 'vendors'; } render(); return; }
  if (el.matches('[data-list-q]')) { W.ui.listQuery = el.value; render(); return; }
  if (el.matches('[data-ui-filter]')) { S.ui.filter = el.value; $('#global-search').value = el.value; render(); return; }
  if (el.matches('[data-clar]') && el.dataset.clar === 'text') { S.clar.text = el.value; save(); return; }
  if (el.matches('[data-email]')) {
    const ctx = emailContext(); if (!ctx) return;
    getDraft(ctx, ctx.sel)[el.dataset.email] = el.value;
    if (el.dataset.email === 'body') { const c = $('#email-count'); if (c) c.textContent = el.value.length.toLocaleString('en-IN') + ' characters'; }
    save();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-bind]')) {
    const [obj, key] = el.dataset.bind.split('.');
    const val = el.value.trim();
    if (val && S[obj][key] !== val) { S[obj][key] = val; S.rfx.dirty = true; log(`Edited ${key === 'title' ? 'RFx title' : key}`); }
    render(); return;
  }
  if (el.matches('[data-bind-num]')) {
    const n = parseInt(el.value.replace(/[^\d]/g, ''), 10);
    if (n > 0 && n !== S.rfx.validityDays) { S.rfx.validityDays = n; S.rfx.dirty = true; log(`Set quote validity to ${n} days`); }
    render(); return;
  }
  if (el.matches('[data-deadline]')) {
    if (el.value) { S.rfx.deadline = fromISTInput(el.value); S.rfx.dirty = true; log(`Moved deadline to ${fmtDT(S.rfx.deadline)}`); }
    render(); return;
  }
  if (el.matches('[data-line-qty]')) {
    const l = draftLineById(el.dataset.lineQty), n = parseInt(el.value.replace(/[^\d]/g, ''), 10);
    if (l && n > 0 && n !== l.qty) { log(`Changed ${l.id} quantity from ${l.qty.toLocaleString('en-IN')} to ${n.toLocaleString('en-IN')}`); l.qty = n; S.rfx.dirty = true; RT.flashLines.add(l.id); }
    render(); return;
  }
  if (el.matches('[data-clause-mand]')) { const c = S.rfx.clauses.find(x => x.id === el.dataset.clauseMand); c.mandatory = el.checked; S.rfx.dirty = true; render(); return; }
  if (el.matches('[data-clause-exp]')) { const c = S.rfx.clauses.find(x => x.id === el.dataset.clauseExp); if (c.expected !== el.value.trim()) { c.expected = el.value.trim(); S.rfx.dirty = true; } render(); return; }
  if (el.matches('[data-ui-toggle]')) { S.ui[el.dataset.uiToggle] = el.checked; render(); return; }
  if (el.matches('[data-clar]') && el.dataset.clar !== 'text') { S.clar[el.dataset.clar] = el.value; render(); return; }
  if (el.matches('[data-award-choice]')) { S.awardChoice = el.value; render(); return; }
  if (el.matches('[data-email-tone]')) { S.email.tone = el.value; save(); return; }
  if (el.matches('[data-merge]')) {
    const tok = el.value; el.value = ''; if (!tok) return;
    const ta = $('#email-body'); if (!ta || ta.readOnly) return;
    const s = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? s;
    ta.value = ta.value.slice(0, s) + tok + ta.value.slice(en);
    ta.focus(); ta.setSelectionRange(s + tok.length, s + tok.length);
    ta.dispatchEvent(new Event('input', { bubbles: true }));
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches?.('[data-rf]')) {
    const k = el.dataset.rf, v = el.value.trim();
    if (S.rfx[k] !== v) { S.rfx[k] = v; S.rfx.dirty = true; if (k === 'title') log(`Renamed RFx to "${v}"`); }
    render(); return;
  }
  if (el.matches?.('[data-rf-num]')) {
    const n = parseInt(el.value.replace(/[^\d]/g, ''), 10);
    if (n > 0 && S.rfx[el.dataset.rfNum] !== n) { S.rfx[el.dataset.rfNum] = n; S.rfx.dirty = true; }
    render(); return;
  }
  if (el.matches?.('[data-lf]')) {
    const [id, f] = el.dataset.lf.split('|'), l = draftLineById(id); if (!l) return;
    const v = f === 'qty' ? (parseInt(el.value.replace(/[^\d]/g, ''), 10) || 0) : el.value.trim();
    if (l[f] !== v) { l[f] = v; S.rfx.dirty = true; }
    render(); return;
  }
  if (el.matches?.('[data-cf]')) {
    const [id, f] = el.dataset.cf.split('|'), c = S.rfx.clauses.find(x => x.id === id); if (!c) return;
    if (c[f] !== el.value.trim()) { c[f] = el.value.trim(); S.rfx.dirty = true; }
    render(); return;
  }
  if (el.matches?.('[data-tf]')) {
    const [id, f] = el.dataset.tf.split('|'), t = S.rfx.terms.find(x => x.id === id); if (!t) return;
    const v = f === 'include' ? el.checked : el.value.trim();
    if (t[f] !== v) { t[f] = v; S.rfx.dirty = true; }
    render(); return;
  }
  if (el.id === 'att-file') {
    for (const f of el.files) S.rfx.attachments.push({ name: f.name.slice(0, 120), size: f.size, addedAt: new Date().toISOString() });
    if (el.files.length) { S.rfx.dirty = true; log(`Attached ${plural(el.files.length, 'file')}`); }
    el.value = ''; render(); return;
  }
  if (e.target.id === 'up-file') { handleQuoteFile(e.target.files[0]); e.target.value = ''; }
  if (e.target.matches?.('[data-fx]')) {
    const c = e.target.dataset.fx, n = parseFloat(e.target.value.replace(/[^d.]/g, ''));
    if (n > 0) S.fx.rates[c] = Math.round(n * 10000) / 10000; else delete S.fx.rates[c];
    S.fx.asOf = todayIST(); S.fx.note = 'Set by buyer';
    log(n > 0 ? `Set ${c} rate to ₹${S.fx.rates[c]} for ${todayIST()}` : `Cleared ${c} rate`);
    if (RT.upload && RT.upload.needCur === c && n > 0) { RT.upload.needCur = null; const st = $('#up-status'); if (st) st.innerHTML = ''; }
    refreshFx(); save();
  }
});
for (const type of ['dragenter', 'dragover']) document.addEventListener(type, e => { const d = e.target.closest?.('#up-drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest?.('#up-drop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  const d = e.target.closest?.('#up-drop');
  if (!d) { if (!$('#modal').hidden) e.preventDefault(); return; }
  e.preventDefault(); d.classList.remove('over');
  const f = e.dataTransfer?.files?.[0]; if (f) handleQuoteFile(f);
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (RENDERERS[h] && h !== W.tab) setTab(h); });

/* ---------- Boot ---------- */
function start(data) {
  W = loadWorkspace(data);
  S = activeEvent();
  const h = location.hash.slice(1);
  if (RENDERERS[h]) W.tab = h;
  if (!RENDERERS[W.tab]) W.tab = 'list';
  $('#global-search').value = S.ui.filter || '';
  render();
  setInterval(() => { if (S) { $('#closing').textContent = remainingText(); } }, 60000);
}
try { window.claude?.hot?.snapshot?.(() => W); } catch (e) { /* not in a viewer */ }
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
</script>
